<title>🚑 救護車嗶寶</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7fd0ef; touch-action: none; }
  body { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* HUD */
  #hud { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none;
         color: #fff; text-shadow: 0 2px 6px rgba(0,40,70,.5); font-weight: bold; }
  #hudL { position: absolute; top: 2.2vmin; left: 2.4vmin; font-size: clamp(16px, 4.4vmin, 40px); letter-spacing: .5px; }
  #hudL span { margin-right: 1.4vmin; display: inline-block; transition: transform .15s; }
  #hudL span.pop { transform: scale(1.5); }
  #hudR { position: absolute; top: 2.4vmin; right: 2.6vmin; font-size: clamp(13px, 3.6vmin, 30px); color: #fff0c0; }
  #hudBarWrap { position: absolute; top: 1.6vmin; left: 50%; transform: translateX(-50%);
                width: min(52vw, 380px); height: clamp(18px, 3.4vmin, 28px);
                background: rgba(0,0,0,.28); border-radius: 999px; overflow: hidden; border: 2px solid rgba(255,255,255,.35); }
  #hudBarFill { height: 100%; width: 0%; border-radius: 999px;
                background: linear-gradient(90deg, #ff6f8a, #ffd54f); transition: width .12s linear; }
  #hudBarSeg { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9.6%, rgba(0,0,0,.22) 9.6% 10%); }
  #hudBarText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-size: clamp(11px, 2.2vmin, 18px); }
  #hudBarWrap.full { animation: glow .5s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 6px #ffd54f } to { box-shadow: 0 0 22px #fff176, 0 0 40px #ffd54f } }
  #hudMag { position: absolute; top: 6vmin; left: 50%; transform: translateX(-50%);
            font-size: clamp(13px, 3vmin, 24px); color: #fff; }

  /* 鏡頭預覽小視窗 */
  #pip { position: fixed; left: 12px; bottom: 12px; width: 160px; height: 120px;
    border: 3px solid rgba(255,255,255,.6); border-radius: 12px; overflow: hidden;
    display: none; z-index: 20; background: #000; }
  #pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #pipDot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 8px #00ff88; transform: translate(-50%,-50%);
    transition: left .1s linear, top .1s linear; }
  #pipHide { position: absolute; top: 2px; right: 2px; width: 28px; height: 28px;
    background: rgba(0,0,0,.5); color: #fff; border: none; border-radius: 8px; font-size: 14px; }

  .overlay { position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; }
  #startOverlay { background: linear-gradient(180deg, #5ec0e8 0%, #bfe6ff 45%, #9fe080 78%, #6fae3e 100%); padding: 2vmin; overflow: hidden; }
  #startOverlay .bg { position: absolute; inset: 0; background: center/cover no-repeat; z-index: -1; }
  #startOverlay .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,30,60,.15), rgba(0,30,60,.45)); }

  .btn { margin: 1.2vmin; padding: 1.8vmin 5vmin; font-size: clamp(15px, 5vmin, 32px); font-weight: bold;
    color: #fff; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 0.6vmin 0 rgba(0,0,0,.35); }
  .btn:active { transform: translateY(0.4vmin); box-shadow: 0 0.2vmin 0 rgba(0,0,0,.35); }

  @media (orientation: portrait) { #rotateHint { display: block; } }

  #loadingOverlay { background: rgba(20,60,90,.92); display: none; }
  #loadingOverlay .spin { font-size: 70px; animation: spin 1.2s linear infinite; }

<body>
<canvas id="game"></canvas>

<div id="hud">

<script>
/* 救護車嗶寶・新美術版（2026-08-23 重製）
   - 引擎：2D Canvas 偽 3D 跑道（馬路往消失點收斂、跑道物件依距離縮放由遠而近）
   - 美術：Codex 生成素材（pic/opt/*.webp），企劃 plan.md、場景 scene.md、清單 assets.json
   - 旁白：Gemini TTS 音檔（snd/*.mp3），缺檔退回瀏覽器語音
   - 體感：與原版 index.html 完全相同（左右移動換道、雙手高舉變身） */
const ART_VER = 3;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight, DPR = 1;

/* ================== 素材 ================== */
const ART = {
  BG001: { file: 'BG001.webp' },                                        // 遠景橫幅（天空、遠山、城市天際線）
  CH001: { file: 'CH001.webp' }, CH002: { file: 'CH002.webp' }, CH003: { file: 'CH003.webp' },   // 嗶寶：直行／轉彎／被撞暈
  CH004: { file: 'CH004.webp' }, CH005: { file: 'CH005.webp' },         // 機器人：背面衝刺／正面登場
  VH101: { file: 'VH101.webp' }, VH102: { file: 'VH102.webp' },         // 橘色小轎車：受傷／治好
  VH201: { file: 'VH201.webp' }, VH202: { file: 'VH202.webp' },         // 藍色廂型車
  VH301: { file: 'VH301.webp' }, VH302: { file: 'VH302.webp' },         // 黃色旅行車
  OB001: { file: 'OB001.webp' }, OB002: { file: 'OB002.webp' }, OB003: { file: 'OB003.webp' },   // 三角錐／石頭／護欄
  IT001: { file: 'IT001.webp' }, IT002: { file: 'IT002.webp' }, IT003: { file: 'IT003.webp' },   // 糖果／愛心糖／星星糖
  IT004: { file: 'IT004.webp' }, IT005: { file: 'IT005.webp' },         // 杯子蛋糕／磁鐵
  TP001: { file: 'TP001.webp' }, TP002: { file: 'TP002.webp' }, TP003: { file: 'TP003.webp' },   // 小房子／高房子／醫院
  TP004: { file: 'TP004.webp' }, TP005: { file: 'TP005.webp' },         // 樹／路燈
  FX001: { file: 'FX001.webp' }, FX002: { file: 'FX002.webp' }, FX003: { file: 'FX003.webp' },   // 雲／撞擊星星／治療十字愛心
  FX004: { file: 'FX004.webp' }, FX005: { file: 'FX005.webp' },         // 煙火／速度線
};
const IMG = {};
function loadArt() {
  return Promise.all(Object.entries(ART).map(([id, a]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[id] = im; a.ar = im.naturalWidth / im.naturalHeight; res(); };
    im.onerror = () => { IMG[id] = null; res(); };
    im.src = 'pic/opt/' + a.file + '?v=' + ART_VER;
  })));
}
const has = id => !!IMG[id];
// 以「中心點 + 高度」畫圖（寬度依長寬比）；flip 水平鏡像；rot 繞中心旋轉；anchorBottom 時 cy 是底部
function pic(id, cx, cy, h, { flip = false, rot = 0, alpha = 1, anchorBottom = false, w = null } = {}) {
  const im = IMG[id]; if (!im) return false;
  const ww = w != null ? w : h * ART[id].ar;
  if (w != null) h = w / ART[id].ar;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, anchorBottom ? cy - h / 2 : cy);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, -ww / 2, -h / 2, ww, h);
  ctx.restore();
  return true;
}
// 沒圖時的退路：畫 emoji（素材還沒到位也能玩、能測）
function emo(txt, cx, cy, h, { rot = 0, alpha = 1, anchorBottom = false } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(cx, anchorBottom ? cy - h / 2 : cy); if (rot) ctx.rotate(rot);
  ctx.font = `${h * 0.9}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, 0, 0); ctx.restore();
}
function sprite(id, fallback, cx, cy, h, opt) { if (!pic(id, cx, cy, h, opt)) emo(fallback, cx, cy, h, opt); }

/* ================== 音效（Web Audio 合成） ================== */
let AC = null;
/* ---- 音訊衛生（全系列共用補丁 2026-08-23）----
   1. 所有聲音接到 MASTER 主音量，分頁切到背景／投放被搶焦點時立刻靜音、回來再開
   2. AudioContext 不是 running（被系統暫停）時不排任何音——否則恢復瞬間會全部疊在一起爆出來
   3. 同時發聲上限 14 個，超過就丟掉（事件連發不會無限疊加）
   4. 循環音全部登記在 AUDIO_LOOPS，背景時一律關掉；語音佇列也清掉 */
let MASTER = null, AUDIO_VOICE_T = [];
const AUDIO_LOOPS = [];
function AUDIO_DEST() { if (!MASTER && AC) { MASTER = AC.createGain(); MASTER.gain.value = 1; MASTER.connect(AC.destination); } return MASTER || AC.destination; }
function audioCanPlay() { if (!AC || AC.state !== 'running') return false; const now = performance.now(); AUDIO_VOICE_T = AUDIO_VOICE_T.filter(t => now - t < 2500); return AUDIO_VOICE_T.length < 14; }
function audioVoiceStart() { AUDIO_VOICE_T.push(performance.now()); }
function audioAllLoopsOff() { for (const l of AUDIO_LOOPS) { try { l.off(); } catch (e) {} } }
function audioGuardInstall() {
  AUDIO_DEST();
  const mute = on => { if (MASTER) MASTER.gain.setTargetAtTime(on ? 0 : 1, AC.currentTime, 0.03); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { mute(true); audioAllLoopsOff(); AUDIO_VOICE_T = []; try { speechSynthesis.cancel(); } catch (e) {} if (curVoice) { try { curVoice.pause(); } catch (e) {} } }
    else { try { AC.resume(); } catch (e) {} mute(false); AUDIO_VOICE_T = []; }
  });
  AC.addEventListener('statechange', () => { if (AC.state !== 'running') { audioAllLoopsOff(); AUDIO_VOICE_T = []; } });
  window.addEventListener('pointerdown', () => { if (AC.state !== 'running') { try { AC.resume(); } catch (e) {} } });
}
function audioInit() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); audioGuardInstall(); } }
function tone(freq, dur, type = 'sine', vol = 0.25, when = 0) {
  if (!audioCanPlay()) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
  o.connect(g); g.connect(AUDIO_DEST());
  audioVoiceStart(); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.05);
}
function sweep(f0, f1, dur, type, vol, when = 0) {
  if (!audioCanPlay()) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, AC.currentTime + when);
  o.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + when + dur);
  g.gain.setValueAtTime(vol, AC.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur + 0.05);
  o.connect(g); g.connect(AUDIO_DEST()); audioVoiceStart(); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.1);
}
function sfxCoin()      { [784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'triangle', 0.22, i * 0.05)); }
function sfxHeart()     { [659, 880, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'sine', 0.2, i * 0.06)); }
function sfxCrash()     { sweep(500, 90, 0.4, 'sawtooth', 0.3); tone(160, 0.2, 'square', 0.28, 0.05); tone(110, 0.25, 'square', 0.22, 0.18); }
function sfxBoing()     { sweep(180, 600, 0.18, 'sine', 0.28); sweep(600, 200, 0.22, 'sine', 0.24); }
function sfxRescue()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'sine', 0.22, i * 0.1)); tone(1319, 0.4, 'triangle', 0.18, 0.4); }
function sfxMagnet()    { sweep(300, 900, 0.3, 'sine', 0.2); tone(1200, 0.2, 'triangle', 0.16, 0.25); }
function sfxTransform() { sweep(220, 1200, 0.5, 'sawtooth', 0.22); [880, 1175, 1568].forEach((f, i) => tone(f, 0.18, 'square', 0.18, 0.5 + i * 0.1)); }
function sfxUntransform() { sweep(900, 300, 0.4, 'triangle', 0.18); tone(523, 0.2, 'sine', 0.16, 0.4); }
function sfxSmash()     { tone(900, 0.06, 'square', 0.22); tone(500, 0.12, 'square', 0.18, 0.05); tone(260, 0.16, 'sawtooth', 0.16, 0.11); }
function sfxMilestone() { [659, 784, 880, 1047, 880, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'square', 0.12, i * 0.12)); }
function sfxAlarm()     { [0, 0.4, 0.8].forEach(d => { tone(880, 0.2, 'square', 0.28, d); tone(587, 0.2, 'square', 0.28, d + 0.2); }); }
function sfxSiren()     { tone(740, 0.3, 'sine', 0.18); tone(560, 0.3, 'sine', 0.18, 0.3); }
function sfxFirework()  { sweep(200, 1400, 0.25, 'sine', 0.12); tone(1800, 0.1, 'triangle', 0.1, 0.25); }
function noiseLoop(filterType, freq, vol) {
  let src = null, gain = null, filt = null;
  const Hd = {
    on() {
      if (!AC || src) return;
      const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      filt = AC.createBiquadFilter(); filt.type = filterType; filt.frequency.value = freq;
      gain = AC.createGain(); gain.gain.value = 0;
      src.connect(filt); filt.connect(gain); gain.connect(AUDIO_DEST());
      src.start();
      gain.gain.linearRampToValueAtTime(vol, AC.currentTime + 0.3);
    },
    setFreq(f) { if (filt) filt.frequency.setTargetAtTime(f, AC.currentTime, 0.1); },
    off() {
      if (!src) return;
      gain.gain.linearRampToValueAtTime(0, AC.currentTime + 0.2);
      const n = src; src = null;
      setTimeout(() => { try { n.stop(); } catch (e) {} }, 300);
    },
    get running() { return !!src; },
  };
  AUDIO_LOOPS.push(Hd); return Hd;
}
const engineSfx = noiseLoop('lowpass', 280, 0.06);

/* ================== 旁白 ================== */
const LINES = {
  s1: ['Three, two, one... rescue time!', '三、二、一，救援出發！'],
  s2: ['Move side to side to change lanes!', '左右移動來換車道'],
  s3: ['A little car needs help!', '有小車需要幫忙！'],
  s4: ['Great rescue!', '救援成功！'],
  s5: ['You made them feel better!', '小車車好多了！'],
  s6: ['Super ambulance!', '超級救護車！'],
  s7: ['Hero driver!', '救援小英雄！'],
  s8: ['Sweet heart! Double points!', '愛心雙倍分！'],
  s9: ['Magnet power!', '磁鐵吸吸吸！'],
  s10: ['Power is full! Hands up!', '能量滿了，雙手舉高！'],
  s11: ["Hands up when you're ready!", '準備好就舉高手！'],
  s12: ['Robot rescue mode! Go, go, go!', '機器人救援模式！'],
  s13: ['Boom! Clear the way!', '砰！障礙飛走啦！'],
  s14: ['Back to ambulance mode!', '嗶寶變回來了！'],
  s15: ['Oops! Silly spin!', '哎呀，轉圈圈！'],
  s16: ['All good! Keep going!', '沒事，繼續出發！'],
  s17: ['Five cars are safe! Hooray!', '成功救援五台車！'],
  s18: ['Too close! Step back, please!', '太近了，請退後一點'],
  s19: ["Perfect! Let's go!", '距離剛剛好，繼續出發！'],
};
const TONE = { excited: { rate: 1.12, pitch: 1.45 }, happy: { rate: 1.05, pitch: 1.3 }, calm: { rate: 1.0, pitch: 1.1 }, warn: { rate: 0.95, pitch: 0.9 } };

function trackFrame() {

  if (!lm) { if (nowT - lastSeen > 700) armsUp = false; return; }
  lastSeen = nowT;
  if (zb) for (const p of lm) { p.x = zb.x + p.x * zb.w; p.y = zb.y + p.y * zb.h; }
  {

      for (const it of items) if (!it.hit && !it.healed && it.z < Z_PLAYER + 14) it.z += 14;   // 推回安全預告距離
    }
    wasPaused = state.paused;
  }

  state.laneX += (state.targetLane - state.laneX) * Math.min(1, dt * 6);
  state.bob = Math.sin(state.t * 9) * 0.5 + Math.sin(state.t * 13) * 0.3;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 16);
  if (state.flash > 0) state.flash -= dt;
  if (state.milestoneT > 0) state.milestoneT -= dt;

  // 循環音每格對齊狀態（不靠邊緣觸發）
  if (state.paused) { engineSfx.setFreq(180); return; }
  if (state.phase === 'play' && !engineSfx.running) engineSfx.on();

  const wantTransform = (state.mode === 'body' ? armsUp : tapTransform); tapTransform = false;
  if (wantTransform && state.charge >= 1 && state.robot <= 0 && state.crash <= 0) {
    state.robot = 6; state.robotIntro = 0.9; state.charge = 0; state.invuln = Math.max(state.invuln, 6.5);
    state.fullSaid = false; state.smashSaid = false; state.flash = 0.5;
    sfxTransform(); fireworks(3); state.shake = 8; say('s12', { gap: 0, priority: 2 });
  }
  if (state.charge >= 1 && state.fullSaid && state.fullSince && state.t - state.fullSince > 7) { state.fullSince = 0; say('s11', { gap: 0 }); }
  if (state.robot > 0) { state.robot -= dt; if (state.robot <= 0) { state.robot = 0; sfxUntransform(); say('s14', { gap: 0 }); state.flash = 0.3; } }
  if (state.robotIntro > 0) state.robotIntro -= dt;
  if (state.invuln > 0) state.invuln -= dt;
  if (magnetT > 0) magnetT -= dt;
  if (state.slow > 0) state.slow -= dt;
  if (state.crash > 0) { state.crash -= dt; state.crashSpin += dt * (Math.PI * 2 * state.crashTurns / 1.1); if (state.crash <= 0) { state.crash = 0; say('s16', { gap: 4000 }); } }
  state.recentCrash = state.recentCrash.filter(t => state.t - t < 8);

  let targetSpeed = 0.6 + Math.min(0.45, state.dist * 0.0033);
  if (state.recentCrash.length >= 2) targetSpeed *= 0.8;   // 連續撞到→暗中降速
  if (state.robot > 0) targetSpeed *= 1.55;
  if (state.crash > 0) targetSpeed *= 0.25;
  if (state.slow > 0) targetSpeed *= 0.5;                   // 救援瞬間短暫放慢
  if (state.robotIntro > 0) targetSpeed *= 0.4;
  state.speed += (targetSpeed - state.speed) * Math.min(1, dt * 3);
  state.dist += state.speed * dt * 2.2;
  const moveSpeed = state.phase === 'play' ? state.speed * 22 : 0;   // 世界單位／秒（倒數時不前進）
  roadScroll += moveSpeed * dt;
  bgScroll += moveSpeed * dt * 0.002;
  engineSfx.setFreq(220 + state.speed * 240);
  camX += (state.laneX * LANE_W * CAM_FOLLOW - camX) * Math.min(1, dt * 5);

  sirenTimer -= dt; if (sirenTimer <= 0) { sfxSiren(); sirenTimer = 3.5 + Math.random() * 3; }

  spawnTimer -= dt;
  const interval = Math.max(0.55, 1.0 - state.dist * 0.004);
  if (spawnTimer <= 0 && state.phase === 'play') { spawnRow(); spawnTimer = interval; }

  // 路邊景物
  scenDist += moveSpeed * dt;
  if (scenDist > 4.5) { scenDist -= 4.5; spawnScenery(Z_FAR + 1); }
  for (let i = scenery.length - 1; i >= 0; i--) { const sc = scenery[i]; sc.z -= moveSpeed * dt; if (sc.z < Z_NEAR - 0.5) scenery.splice(i, 1); }

  // 跑道物件
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.z -= moveSpeed * dt; it.bob += dt * 6;
    if (it.kind === 'hurt') {
      if (it.healed) { it.ht += dt; it.z += (moveSpeed + 4 + 12 * Math.min(1, it.ht)) * dt; it.lane += ((it.lane < 0 ? -1.9 : 1.9) - it.lane) * Math.min(1, dt * 0.9); }   // 治好→一邊彈跳一邊往前開去路邊（相對玩家永遠往遠方走）
      else it.z -= -moveSpeed * 0.35 * dt;   // 受傷車本身慢慢往前開（相對速度變慢，好救）
    }
    if (magnetT > 0 && it.kind === 'coin' && !it.hit && it.z < Z_PLAYER + 25) it.lane += (state.laneX - it.lane) * Math.min(1, dt * 4);
    if (!it.hit && !it.healed && it.z < Z_PLAYER + 0.7 && it.z > Z_PLAYER - 0.9) {

      const near = Math.abs(it.lane - state.laneX) < tol;

    if (it.smashed) { it.st = (it.st || 0) + dt; it.z += (moveSpeed + 9) * dt; it.vy -= dt * 6; it.y += it.vy * dt; it.lane += it.vx * dt; it.rot = (it.rot || 0) + it.spin * dt; }   // 撞飛：往遠方翻滾飛走、淡出
    const gone = it.z < Z_NEAR - 0.5 || it.z > Z_FAR + 2 || (it.smashed && it.st > 1.3) || (it.hit && !it.smashed) || (it.healed && it.ht > 4);
    if (gone) items.splice(i, 1);
  }

  // 粒子（螢幕座標）
  for (let i = particles.length - 1; i >= 0; i--) {

    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += H * 0.9 * dt; p.life -= dt; p.rot += p.vr * dt;

  }
  for (let i = fxs.length - 1; i >= 0; i--) { const f = fxs[i]; f.t += dt; if (f.t > f.life) fxs.splice(i, 1); }
  for (const c of clouds) { c.x -= c.v * dt * (1 + state.speed * 0.3); if (c.x < -0.25) { c.x = 1.25; c.y = 0.03 + Math.random() * 0.18; } }
}

/* ================== 繪製 ================== */
function quad(x1a, ya, x2a, x1b, yb, x2b, color, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x1a, ya); ctx.lineTo(x2a, ya); ctx.lineTo(x2b, yb); ctx.lineTo(x1b, yb); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawBackground() {
  const hy = H * HORIZON + shakeY;
  if (has('BG001')) {
    const im = IMG['BG001'], ar = ART.BG001.ar;
    // 遠景橫幅：底邊貼地平線略下，高度蓋滿上方；隨車道位置與里程極慢平移
    const bh = hy * 1.12, bw = Math.max(W * 1.3, bh * ar);
    const off = ((bgScroll * 0.15 + camX * 0.04) % 1 + 1) % 1;
    const x0 = -(bw - W) / 2 - (off - 0.5) * (bw - W) * 0.6;
    ctx.drawImage(im, x0, hy - bh, bw, bh);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, '#4fb3e8'); g.addColorStop(1, '#cfeeff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy + 2);
    ctx.fillStyle = '#8fd08a';
    for (let i = 0; i < 7; i++) { const cx = ((i / 7 + 0.07 - bgScroll * 0.02 - camX * 0.01) % 1 + 1) % 1 * W * 1.2 - W * 0.1; ctx.beginPath(); ctx.ellipse(cx, hy + 4, W * 0.18, H * 0.07, 0, Math.PI, 0); ctx.fill(); }
  }
  for (const c of clouds) sprite('FX001', '☁️', c.x * W - camX * 0.03 * W, c.y * H, H * c.h, { alpha: 0.95 });
}
function drawRoad() {
  const segs = [];
  let z0 = Z_NEAR;
  while (z0 < Z_FAR) {
    const k = Math.floor((z0 + roadScroll) / SEG);
    const z1 = Math.min(Z_FAR, (k + 1) * SEG - roadScroll + 1e-4);
    segs.push([z0, z1, k]); z0 = z1;
  }
  // 地面底色
  const hy = H * HORIZON + shakeY;
  ctx.fillStyle = '#ecdbb8'; ctx.fillRect(0, hy, W, H - hy);
  for (let i = segs.length - 1; i >= 0; i--) {
    const [za, zb, k] = segs[i];
    const pa = proj(0, za), pb = proj(0, zb);
    const par = k & 1;
    const fog = Math.min(0.55, Math.max(0, (zb - 20) / (Z_FAR - 20)) * 0.55);
    // 人行道（奶油色兩階交替）＋外側草綠
    ctx.fillStyle = par ? '#f3e4c4' : '#ecdbb8'; ctx.fillRect(0, pb.sy, W, pa.sy - pb.sy + 1);
    const g0 = ROAD_HALF + 1.6;
    quad(-W, pa.sy + 1, pa.sx - g0 * pa.s, -W, pb.sy, pb.sx - g0 * pb.s, par ? '#8ed46a' : '#83cb60');
    quad(pa.sx + g0 * pa.s, pa.sy + 1, W * 2, pb.sx + g0 * pb.s, pb.sy, W * 2, par ? '#8ed46a' : '#83cb60');
    // 馬路（藍灰柏油）
    quad(pa.sx - ROAD_HALF * pa.s, pa.sy + 1, pa.sx + ROAD_HALF * pa.s, pb.sx - ROAD_HALF * pb.s, pb.sy, pb.sx + ROAD_HALF * pb.s, par ? '#5f6a7d' : '#58637a');
    // 路緣：亮藍綠條 + 白色邊線
    const e0 = ROAD_HALF, e1 = ROAD_HALF + 0.08, e2 = ROAD_HALF + 0.26;
    quad(pa.sx - e1 * pa.s, pa.sy + 1, pa.sx - e0 * pa.s, pb.sx - e1 * pb.s, pb.sy, pb.sx - e0 * pb.s, '#ffffff', 0.9);
    quad(pa.sx + e0 * pa.s, pa.sy + 1, pa.sx + e1 * pa.s, pb.sx + e0 * pb.s, pb.sy, pb.sx + e1 * pb.s, '#ffffff', 0.9);
    quad(pa.sx - e2 * pa.s, pa.sy + 1, pa.sx - e1 * pa.s, pb.sx - e2 * pb.s, pb.sy, pb.sx - e1 * pb.s, par ? '#5fd0c8' : '#6fd9d0');
    quad(pa.sx + e1 * pa.s, pa.sy + 1, pa.sx + e2 * pa.s, pb.sx + e1 * pb.s, pb.sy, pb.sx + e2 * pb.s, par ? '#5fd0c8' : '#6fd9d0');
    // 車道虛線
    if (!par) for (const lx of [-0.5, 0.5]) quad(pa.sx + (lx - 0.035) * pa.s, pa.sy + 1, pa.sx + (lx + 0.035) * pa.s, pb.sx + (lx - 0.035) * pb.s, pb.sy, pb.sx + (lx + 0.035) * pb.s, '#ffffff', 0.85);
    if (fog > 0) { ctx.globalAlpha = fog; ctx.fillStyle = '#dfeffb'; ctx.fillRect(0, pb.sy, W, pa.sy - pb.sy + 1); ctx.globalAlpha = 1; }
  }
}
function drawScenery(sc) {
  const p = proj(sc.x, sc.z);
  const h = sc.k.h * p.s;
  const fog = Math.min(0.6, Math.max(0, (sc.z - 25) / (Z_FAR - 25)) * 0.7);
  sprite(sc.k.id, sc.k.emo, p.sx, p.sy, h, { anchorBottom: true, alpha: 1 - fog, flip: sc.side > 0 });
}
function drawItem(it) {
  const p = proj(it.lane * LANE_W, it.z);
  const fog = Math.min(0.5, Math.max(0, (it.z - 30) / (Z_FAR - 30)) * 0.6);
  if (it.kind === 'coin') {
    const fl = Math.sin(it.bob) * 0.12 + 0.25;
    ctx.globalAlpha = 0.25; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 0.24 * p.s, 0.06 * p.s, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    sprite(it.ck.id, it.ck.emo, p.sx, p.sy - fl * p.s, 0.5 * p.s, { anchorBottom: true, alpha: 1 - fog });
  } else if (it.kind === 'magnet') {
    const fl = Math.sin(it.bob) * 0.12 + 0.25;
    sprite('IT005', '🧲', p.sx, p.sy - fl * p.s, 0.55 * p.s, { anchorBottom: true, alpha: 1 - fog });
  } else if (it.kind === 'cone') {
    const y = it.smashed ? it.y : 0;
    sprite(it.ob.id, it.ob.emo, p.sx, p.sy - y * p.s, it.ob.h * p.s, { anchorBottom: !it.smashed, rot: it.rot || 0, alpha: it.smashed ? Math.max(0, 1 - it.st / 1.3) : 1 - fog });
  } else if (it.kind === 'hurt') {

    const jump = it.healed ? Math.abs(Math.sin(it.ht * 9)) * 0.35 * Math.max(0, 1 - it.ht / 2) : 0;
    const wob = it.healed ? 0 : Math.sin(it.bob * 1.3) * 0.04;
    const al = it.healed ? Math.max(0, 1 - Math.max(0, it.ht - 3)) : 1 - fog;
    sprite(id, it.k.emo, p.sx, p.sy - jump * p.s, 0.8 * p.s, { anchorBottom: true, rot: wob, alpha: al });
    if (!it.healed) {
      // 目標車道光圈（畫在車底，先畫）＋ SOS 大紅牌（程式畫，脈動不閃滅，遠處也看得到）
      drawSOS(p, it);
    }
  }
}
function drawSOS(p, it) {
  const pulse = 1 + 0.12 * Math.sin(state.t * 7);
  // 車道光圈：亮黃、脈動，越近越明顯
  const k = Math.min(1, Math.max(0, (Z_PLAYER + 26 - it.z) / 20));
  if (k > 0) { ctx.globalAlpha = (0.3 + 0.2 * Math.sin(state.t * 6)) * k; ctx.fillStyle = '#ffee58'; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 0.6 * p.s * pulse, 0.16 * p.s * pulse, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  // SOS 牌：最小也要看得清楚（遠處用螢幕像素下限），白邊紅底白字
  const hh = Math.max(H * 0.055, 0.38 * p.s) * pulse, ww = hh * 1.9, cy = p.sy - 1.0 * p.s - hh * 0.6, r = hh * 0.3;
  ctx.save();
  ctx.translate(p.sx, cy);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-ww / 2 - hh * 0.1, -hh / 2 - hh * 0.1, ww + hh * 0.2, hh + hh * 0.2, r + hh * 0.1); ctx.fill();
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.roundRect(-ww / 2, -hh / 2, ww, hh, r); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${hh * 0.72}px "Arial Black",Arial,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SOS', 0, hh * 0.04);

}
const TURN_IMG_LEFT = true;   // CH002 實圖是往左轉（看得到車右側）；往右時鏡像
function drawPlayer() {
  const p = proj(state.laneX * LANE_W, Z_PLAYER);
  const bobY = Math.max(0, state.bob) * 0.03 * p.s;
  const turn = state.targetLane - state.laneX;
  // 影子
  ctx.globalAlpha = 0.28; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 0.48 * p.s, 0.1 * p.s, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;

    // 變身瞬間：正面帥氣登場（放大彈出）
    const k = 1 - state.robotIntro / 0.9, sc = 1 + Math.sin(k * Math.PI) * 0.35;
    sprite('CH005', '🤖', p.sx, p.sy - bobY, 1.6 * p.s * sc, { anchorBottom: true });
    return;
  }
  if (state.robot > 0) {
    sprite('CH004', '🤖', p.sx, p.sy - bobY - 0.05 * p.s, 1.45 * p.s, { anchorBottom: true, rot: turn * 0.18 });
    return;
  }
  if (state.crash > 0) {

    sprite('CH003', '😵', p.sx, p.sy - lift * p.s - 0.5 * p.s, 0.92 * p.s, { rot: state.crashSpin * state.crashDir });

    if (has('FX002')) pic('FX002', p.sx, p.sy - lift * p.s - 0.5 * p.s, 1.4 * p.s, { rot: state.t * 2.5, alpha: 0.95 });
    else { const ang = state.t * 6; emo('💫', p.sx + Math.cos(ang) * 0.5 * p.s, p.sy - 1.2 * p.s - lift * p.s, 0.6 * p.s); }
    return;
  }
  const blink = state.invuln > 0 && Math.floor(state.t * 12) % 2 === 0;
  if (Math.abs(turn) > 0.18 && has('CH002')) pic('CH002', p.sx, p.sy - bobY, 0.92 * p.s, { anchorBottom: true, flip: (turn > 0) === TURN_IMG_LEFT, alpha: blink ? 0.55 : 1 });
  else sprite('CH001', '🚑', p.sx, p.sy - bobY, 0.92 * p.s, { anchorBottom: true, rot: turn * 0.12, alpha: blink ? 0.55 : 1 });
}
function drawFx() {
  for (const f of fxs) {

    const k = f.t / f.life;
    const sc = f.pop ? (k < 0.3 ? k / 0.3 : 1) : 1 + k * 0.5;
    const al = f.pop ? (k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3) : 1 - k;
    sprite(f.id, f.fallback, f.x, f.y - f.rise * f.h * k, f.h * sc, { alpha: al });
  }
  for (const p of particles) emo(p.txt, p.x, p.y, p.sz, { rot: p.rot, alpha: Math.max(0, p.life / p.max) });
}
function drawOverlay() {

    if (!pic('FX005', W / 2, H / 2, H * 1.15, { alpha: al, w: W * 1.15 })) {
      ctx.save(); ctx.globalAlpha = al * 0.6; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2 + state.t * 2; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * W * 0.35, H / 2 + Math.sin(a) * H * 0.35); ctx.lineTo(W / 2 + Math.cos(a) * W, H / 2 + Math.sin(a) * H); ctx.stroke(); }
      ctx.restore();
    }
  }

    ctx.lineWidth = H * 0.012; ctx.strokeStyle = '#b8002e'; ctx.strokeText(`🚑 救了 ${state.rescued} 台車！`, 0, 0); ctx.fillStyle = '#ffeb3b'; ctx.fillText(`🚑 救了 ${state.rescued} 台車！`, 0, 0);
    ctx.restore();
  }

    const v = Math.min(W, H);

    ctx.font = `bold ${v * 0.05}px "Microsoft JhengHei","Noto Sans TC",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(caption.text).width + v * 0.06;

function draw() {
  shakeY = state.shake > 0 ? (Math.random() - 0.5) * state.shake * H * 0.004 : 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawRoad();
  // 遠→近排序：景物、跑道物件、玩家
  const list = [];
  for (const sc of scenery) list.push({ z: sc.z, f: () => drawScenery(sc) });
  for (const it of items) list.push({ z: it.z, f: () => drawItem(it) });
  list.push({ z: Z_PLAYER, f: drawPlayer });
  list.sort((a, b) => b.z - a.z);
  for (const d of list) d.f();
  if (state.phase === 'countdown') {
    // 示範：左右箭頭 + 嗶寶跟著滑（-1 → 0 → 1）
    const k = (state.t % 3.6) / 3.6, seq = [-1, 0, 1, 0];
    const i = Math.floor(k * 4), f = k * 4 - i, a = seq[i], b = seq[(i + 1) % 4];
    state.targetLane = a + (b - a) * Math.min(1, f * 1.6);

    ctx.save(); ctx.globalAlpha = 0.9; ctx.font = `bold ${0.5 * p.s}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1d3a5a'; ctx.lineWidth = 0.05 * p.s;
    for (const [sx, t] of [[p.sx - 1.75 * p.s - bounce, '◀'], [p.sx + 1.75 * p.s + bounce, '▶']]) { ctx.strokeText(t, sx, p.sy - 0.6 * p.s); ctx.fillText(t, sx, p.sy - 0.6 * p.s); }
    ctx.restore();
  }
  drawFx();
  drawOverlay();
}

/* ================== HUD ================== */
const hScore = document.getElementById('hScore'), hCoin = document.getElementById('hCoin'), hRescue = document.getElementById('hRescue'), hKm = document.getElementById('hKm');
const hBarFill = document.getElementById('hudBarFill'), hBarText = document.getElementById('hudBarText'), hBarWrap = document.getElementById('hudBarWrap'), hMag = document.getElementById('hudMag');
function syncHUD() {
  if (state.phase !== 'play') return;
  hScore.textContent = '🏆 ' + state.score;
  hCoin.textContent = '🍬 ' + state.coins;
  hRescue.textContent = '🚑 ' + state.rescued + (state.best > state.rescued ? ' / 最佳 ' + state.best : '');
  hKm.textContent = state.dist.toFixed(1) + ' KM';
  hBarFill.style.width = (state.charge * 100) + '%';
  hBarWrap.classList.toggle('full', state.charge >= 1 && state.robot <= 0);
  if (state.robot > 0) hBarText.textContent = '🤖 機器人衝刺！ ' + state.robot.toFixed(1) + 's';
  else if (state.charge >= 1) hBarText.textContent = state.mode === 'body' ? '✋ 雙手高舉變身！' : '👆 點上方變身！';
  else hBarText.textContent = '變身能量';
  hMag.textContent = magnetT > 0 ? '🧲 磁鐵 ' + magnetT.toFixed(1) + 's' : '';
}

/* ================== 主迴圈 ================== */
function onResize() {
  W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  FOCAL = (0.905 - HORIZON) * H * Z_PLAYER / CAM_H;   // 讓玩家落在畫面高度 90%（車壓在底部，不擋前方）
}
window.addEventListener('resize', onResize);
onResize();
for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * 1.3 - 0.15, y: 0.03 + Math.random() * 0.2, h: 0.07 + Math.random() * 0.05, v: 0.012 + Math.random() * 0.012 });

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (state.phase !== 'menu') { update(dt, now); draw(); syncHUD(); }
  requestAnimationFrame(loop);
}
loadArt().then(() => {
  if (has('BG001')) document.getElementById('startBg').style.backgroundImage = 'url(pic/opt/BG001.webp?v=' + ART_VER + ')';
});
loadVoices();
requestAnimationFrame(loop);

// 測試勾子：分頁在背景時 rAF 不跑，用這個直接推進模擬（只給自動化驗證用，遊戲本身不呼叫）
window.__dbg = { state, items, scenery, particles, fxs, IMG, say, get magnetT() { return magnetT; } };
window.__sim = (sec, input = {}) => {
  Object.assign(state, input);
  if (input.armsUp != null) armsUp = input.armsUp;
  if (input.tap) tapTransform = true;
  const steps = Math.round(sec * 60);
  for (let i = 0; i < steps; i++) update(1 / 60, performance.now() + i * 16.7);
  draw();
  return { phase: state.phase, lane: +state.laneX.toFixed(2), speed: +state.speed.toFixed(2), dist: +state.dist.toFixed(1), score: state.score, coins: state.coins, rescued: state.rescued, charge: +state.charge.toFixed(2), robot: +state.robot.toFixed(1), crash: +state.crash.toFixed(2), magnet: +magnetT.toFixed(1), items: items.map(it => ({ k: it.kind, l: +it.lane.toFixed(1), z: +it.z.toFixed(1), hit: it.hit, healed: it.healed })), scenery: scenery.length };
};
</script>
