<script>
/* 消防車救援隊・新美術版（2026-08-24 玩法重製）
   - 玩法：站到求救窗戶正下方→水柱自動噴→火滅→雲梯自動接小動物→坐進車裡；每 2～3 次穿插屋頂救援（蹲下壓氣墊、起身彈出）；
           坐滿 5 隻→雙手高舉→全員水花派對→休息站→新一輪。沒有失敗、沒有時間壓力。
   - 體感：整個人左右站位（主操作）、蹲下（屋頂）、雙手高舉（派對）——三個訊號分階段隔離。
   - 美術：Codex 生成素材（pic/opt/*.webp）；旁白 Gemini TTS（snd/*.mp3），缺檔退回瀏覽器語音。 */
const ART_VER = 1;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight, DPR = 1;

/* ================== 素材與錨點（正規化座標，拿到圖後校） ================== */
const ART = {
  BG001: { file: 'BG001.webp' }, BG002: { file: 'BG002.webp' }, BG003: { file: 'BG003.webp' }, BG004: { file: 'BG004.webp' },
  VH001: { file: 'VH001.webp' }, VH002: { file: 'VH002.webp' }, VH003: { file: 'VH003.webp' }, VH004: { file: 'VH004.webp' },
  TP001: { file: 'TP001.webp' }, TP002: { file: 'TP002.webp' }, TP003: { file: 'TP003.webp' }, TP004: { file: 'TP004.webp' }, TP005: { file: 'TP005.webp' },
  TP006: { file: 'TP006.webp' }, TP007: { file: 'TP007.webp' },
  CH101: { file: 'CH101.webp' }, CH201: { file: 'CH201.webp' }, CH301: { file: 'CH301.webp' }, CH401: { file: 'CH401.webp' }, CH501: { file: 'CH501.webp' }, CH601: { file: 'CH601.webp' },
  FX001: { file: 'FX001.webp' }, FX002: { file: 'FX002.webp' }, FX003: { file: 'FX003.webp' }, FX004: { file: 'FX004.webp' }, FX005: { file: 'FX005.webp' },
  FX006: { file: 'FX006.webp' }, FX007: { file: 'FX007.webp' }, FX008: { file: 'FX008.webp' }, FX009: { file: 'FX009.webp' },
};
// 消防車錨點（相對圖片寬高）：水砲口、雲梯轉軸、五個乘客座位中心、眼睛
const TRUCK = { cannon: [0.45, 0.04], pivot: [0.30, 0.10], seats: [[0.108, 0.38], [0.233, 0.38], [0.358, 0.38], [0.483, 0.38], [0.608, 0.38]], eye: null, seatR: 0.1 };   // 依 VH001 實圖量的（車頂沒有水砲，水柱從車頂中央出）
// 房屋錨點：窗戶中心（相對房屋圖）、屋頂落點
const HOUSES = {   // 依實圖量的窗戶中心
  TP001: { windows: [[0.28, 0.41], [0.5, 0.41], [0.72, 0.41], [0.28, 0.74], [0.5, 0.74], [0.72, 0.74]], roof: null },
  TP002: { windows: [[0.25, 0.51], [0.52, 0.51], [0.78, 0.51], [0.25, 0.75], [0.52, 0.75], [0.78, 0.75]], roof: null },
  TP003: { windows: [[0.22, 0.30], [0.5, 0.30], [0.78, 0.30], [0.22, 0.535], [0.5, 0.535], [0.78, 0.535], [0.22, 0.76], [0.78, 0.76]], roof: [0.5, 0.03] },
  TP004: { windows: [[0.48, 0.32], [0.3, 0.53], [0.7, 0.53], [0.7, 0.8]], roof: null },
  TP005: { windows: [[0.5, 0.25], [0.3, 0.46], [0.7, 0.46], [0.23, 0.81], [0.77, 0.81]], roof: null },
};
const LADDER = { a: [0.03, 0.92], b: [0.90, 0.15] };   // VH003 基座端 → 籃子端（相對圖片）
const ANIMALS = [
  { id: 'CH101', emo: '🐱', name: '小貓' }, { id: 'CH201', emo: '🐶', name: '小狗' }, { id: 'CH301', emo: '🐰', name: '小兔' },
  { id: 'CH401', emo: '🐥', name: '小鴨' }, { id: 'CH501', emo: '🦔', name: '小刺蝟' }, { id: 'CH601', emo: '🐿️', name: '小松鼠' },
];
const IMG = {};
function loadArt() {
  return Promise.all(Object.entries(ART).map(([id, a]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { IMG[id] = im; a.ar = im.naturalWidth / im.naturalHeight; res(); };
    im.onerror = () => { IMG[id] = null; res(); };
    im.src = 'pic/opt/' + a.file + '?v=' + ART_VER;
  })));
}
const has = id => !!IMG[id];
function pic(id, cx, cy, h, { flip = false, rot = 0, alpha = 1, anchorBottom = false, w = null, sx = 1, sy = 1 } = {}) {
  const im = IMG[id]; if (!im) return false;
  let ww = w != null ? w : h * ART[id].ar;
  if (w != null) h = w / ART[id].ar;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, anchorBottom ? cy : cy);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.scale(sx, sy);
  ctx.drawImage(im, -ww / 2, anchorBottom ? -h : -h / 2, ww, h);
  ctx.restore();
  return true;
}
function emo(txt, cx, cy, h, { rot = 0, alpha = 1, anchorBottom = false, flip = false } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(cx, anchorBottom ? cy - h / 2 : cy); if (rot) ctx.rotate(rot); if (flip) ctx.scale(-1, 1);
  ctx.font = `${h * 0.9}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, 0, 0); ctx.restore();
}
function sprite(id, fallback, cx, cy, h, opt) { if (!pic(id, cx, cy, h, opt)) emo(fallback, cx, cy, h, opt); }
// 雲梯：圖片上 a 點對齊 (px,py)，a→b 方向轉到「向上偏 ang」、長度 = L（等比縮放）
function picLink(id, px, py, ang, L) {
  const im = IMG[id]; if (!im) return false;
  const iw = im.naturalWidth, ih = im.naturalHeight;
  const ax = LADDER.a[0] * iw, ay = LADDER.a[1] * ih, bx = LADDER.b[0] * iw, by = LADDER.b[1] * ih;
  const dx = bx - ax, dy = by - ay, dl = Math.hypot(dx, dy) || 1, a0 = Math.atan2(dy, dx);
  const sc = L / dl, want = ang - Math.PI / 2;   // 「向上」= -90°，ang 是相對向上的偏角（順時針為正）
  ctx.save(); ctx.translate(px, py); ctx.rotate(want - a0); ctx.scale(sc, sc); ctx.drawImage(im, -ax, -ay, iw, ih); ctx.restore();
  return true;
}
// 以「圖片底邊中點對齊 (px,py)、向上方向轉到角度 ang、長度 L」畫水柱（非等比伸縮）
function picBeam(id, fallback, px, py, ang, L, width = null, alpha = 1) {
  const im = IMG[id];
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(px, py); ctx.rotate(ang);
  if (im) { const w = width != null ? width : L * ART[id].ar; ctx.drawImage(im, -w / 2, -L, w, L); }
  else { ctx.font = `${Math.max(12, L * 0.25)}px sans-serif`; ctx.textAlign = 'center'; for (let i = 0; i < 4; i++) ctx.fillText(fallback, 0, -L * (i + 0.5) / 4); }
  ctx.restore();
}

/* ================== 音效（Web Audio 合成）＋ 音訊衛生 ================== */
let AC = null, MASTER = null, AUDIO_VOICE_T = [];
const AUDIO_LOOPS = [];
function AUDIO_DEST() { if (!MASTER && AC) { MASTER = AC.createGain(); MASTER.gain.value = 1; MASTER.connect(AC.destination); } return MASTER || AC.destination; }
function audioCanPlay() { if (!AC || AC.state !== 'running') return false; const now = performance.now(); AUDIO_VOICE_T = AUDIO_VOICE_T.filter(t => now - t < 2500); return AUDIO_VOICE_T.length < 14; }
function audioVoiceStart() { AUDIO_VOICE_T.push(performance.now()); }
function audioAllLoopsOff() { for (const l of AUDIO_LOOPS) { try { l.off(); } catch (e) {} } }
function audioGuardInstall() {
  AUDIO_DEST();
  const mute = on => { if (MASTER) MASTER.gain.setTargetAtTime(on ? 0 : 1, AC.currentTime, 0.03); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { mute(true); audioAllLoopsOff(); AUDIO_VOICE_T = []; try { speechSynthesis.cancel(); } catch (e) {} if (curVoice) { try { curVoice.pause(); } catch (e) {} } }
    else { try { AC.resume(); } catch (e) {} mute(false); AUDIO_VOICE_T = []; }
  });
  AC.addEventListener('statechange', () => { if (AC.state !== 'running') { audioAllLoopsOff(); AUDIO_VOICE_T = []; } });
  window.addEventListener('pointerdown', () => { if (AC.state !== 'running') { try { AC.resume(); } catch (e) {} } });
}
function audioInit() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); audioGuardInstall(); } }
function tone(freq, dur, type = 'sine', vol = 0.25, when = 0) {
  if (!audioCanPlay()) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
  o.connect(g); g.connect(AUDIO_DEST());
  audioVoiceStart(); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.05);
}
function sweep(f0, f1, dur, type, vol, when = 0) {
  if (!audioCanPlay()) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, AC.currentTime + when);
  o.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + when + dur);
  g.gain.setValueAtTime(vol, AC.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur + 0.05);
  o.connect(g); g.connect(AUDIO_DEST()); audioVoiceStart(); o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.1);
}
function noiseLoop(filterType, freq, vol) {
  let src = null, gain = null, filt = null;
  const Hd = {
    on() {
      if (!AC || src) return;
      const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      filt = AC.createBiquadFilter(); filt.type = filterType; filt.frequency.value = freq;
      gain = AC.createGain(); gain.gain.value = 0;
      src.connect(filt); filt.connect(gain); gain.connect(AUDIO_DEST());
      src.start();
      gain.gain.linearRampToValueAtTime(vol, AC.currentTime + 0.3);
    },
    setVol(v) { if (gain) gain.gain.setTargetAtTime(v, AC.currentTime, 0.1); },
    off() { if (!src) return; gain.gain.linearRampToValueAtTime(0, AC.currentTime + 0.2); const n = src; src = null; setTimeout(() => { try { n.stop(); } catch (e) {} }, 300); },
    get running() { return !!src; },
  };
  AUDIO_LOOPS.push(Hd); return Hd;
}
const waterSfx = noiseLoop('bandpass', 1400, 0.0);   // 噴水時開，音量隨狀態對齊
function sfxLock()      { [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.22, i * 0.06)); }
function sfxHiss()      { sweep(1800, 500, 0.5, 'sawtooth', 0.06); }
function sfxLadder()    { for (let i = 0; i < 6; i++) tone(300 + i * 60, 0.08, 'square', 0.12, i * 0.09); }
function sfxSeat()      { sweep(300, 900, 0.18, 'sine', 0.25); tone(1047, 0.25, 'triangle', 0.2, 0.18); }
function sfxCheer()     { [659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'sine', 0.2, i * 0.08)); }
function sfxSplash()    { sweep(900, 200, 0.25, 'sine', 0.18); tone(150, 0.15, 'square', 0.1, 0.05); }
function sfxSqueeze()   { sweep(500, 180, 0.35, 'sawtooth', 0.12); }
function sfxBoing()     { sweep(180, 700, 0.18, 'sine', 0.3); sweep(700, 220, 0.25, 'sine', 0.24, 0.15); }
function sfxSneeze()    { sweep(400, 900, 0.12, 'square', 0.12); sweep(900, 200, 0.3, 'sawtooth', 0.18, 0.12); }
function sfxParty()     { sweep(220, 1200, 0.5, 'sawtooth', 0.22); [880, 1175, 1568, 2093].forEach((f, i) => tone(f, 0.2, 'square', 0.16, 0.5 + i * 0.1)); }
function sfxFirework()  { sweep(200, 1400, 0.25, 'sine', 0.12); tone(1800, 0.1, 'triangle', 0.1, 0.25); }
function sfxAlarm()     { [0, 0.4, 0.8].forEach(d => { tone(880, 0.2, 'square', 0.28, d); tone(587, 0.2, 'square', 0.28, d + 0.2); }); }
function sfxSiren()     { tone(740, 0.3, 'sine', 0.14); tone(560, 0.3, 'sine', 0.14, 0.3); }

/* ================== 旁白 ================== */

const LINE_TONE = { s1: 'excited', s2: 'calm', s3: 'happy', s4: 'happy', s5: 'excited', s6: 'happy', s7: 'happy', s8: 'happy', s9: 'calm', s10: 'excited', s11: 'excited', s12: 'excited', s13: 'excited', s14: 'happy', s15: 'happy', s16: 'warn', s17: 'happy' };

    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    if (!vs.length) return null;
    const score = v => (/natural|neural/i.test(v.name) ? 40 : 0) + (/google/i.test(v.name) ? 30 : 0) + (/en[-_]US/i.test(v.lang) ? 10 : 0) + (/female|samantha|zira|aria|jenny/i.test(v.name) ? 5 : 0) + (v.localService ? 0 : 3);

/* ================== 房屋與窗戶幾何 ================== */
function houseRect(slot) {   // 五個槽位等分；回傳房屋圖的螢幕矩形
  const id = HOUSE_IDS[state.houseOrder[slot]];
  const hh = H * LAY.houseH * (id === 'TP002' ? 1.0 : 0.92), ar = has(id) ? ART[id].ar : 0.9;
  let hw = hh * ar; const maxW = W / 5 * 0.98; let hhh = hh;

}
function windowPos(slot, wi) { const r = houseRect(slot), a = HOUSES[r.id].windows[wi]; return { x: r.x + a[0] * r.w, y: r.y + a[1] * r.h }; }

/* ================== 回合流程 ================== */
function usedAnimals() { return state.seats.map(s => s.id); }
function pickAnimal() {
  const used = usedAnimals(), last = state.target && state.target.animal;
  const pool = ANIMALS.filter(a => !used.includes(a.id) && (!last || a.id !== last.id));
  return pick(pool.length ? pool : ANIMALS);
}
function newTarget() {
  // 七成近、三成遠；不連續兩個最遠端
  const cands = [];
  for (let s = 0; s < 5; s++) { const n = HOUSES[houseRect(s).id].windows.length; for (let w = 0; w < n; w++) { const x = windowPos(s, w).x; if (x > W * 0.12 && x < W * 0.88) cands.push({ s, w, x }); } }   // 只挑消防車搆得到的窗
  const near = cands.filter(c => Math.abs(c.x / W - state.truckX) < 0.28), far = cands.filter(c => Math.abs(c.x / W - state.truckX) >= 0.28);
  let c = (Math.random() < 0.7 && near.length) ? pick(near) : pick(far.length ? far : near);
  if (!state.target) { const mid = cands.filter(cc => Math.abs(cc.x / W - 0.5) > 0.18 && Math.abs(cc.x / W - 0.5) < 0.4); if (mid.length) c = pick(mid); }   // 第一個目標：離出發點一點距離，讓小孩先動一次

  state.animalPos = { x: p.x, y: p.y, s: 1 }; state.animalVis = true; state.cushion = 1; state.charged = false;
  { const tw = TH() * (has('VH001') ? ART.VH001.ar : 1.8); state.truckTargetX = clamp((p.x - tw * 0.5 - TH() * 0.5) / W, 0.15, 0.85); }   // 氣墊對齊屋頂正下方

/* ================== 特效 ================== */
function burst(sx, sy, n, pool, { up = 2, life = 0.8, size = 1 } = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (0.6 + Math.random() * 1.4) * H * 0.22;
    particles.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - up * H * 0.1, life: life * (0.7 + Math.random() * 0.6), max: life, txt: pick(pool), sz: (0.025 + Math.random() * 0.025) * H * size, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8 });
  }
}

  for (let i = 0; i < n; i++) {

    state.fireworks.push({ x, y, t: -i * 0.3, col: pick(['#ff5252', '#ffd740', '#40c4ff', '#69f0ae', '#ffab40']), r: H * (0.06 + Math.random() * 0.06) });

function splashAt(x) {

/* ================== 更新 ================== */
function update(dt, nowMs) {
  state.t += dt; state.stepT += dt;
  if (caption.t > 0) caption.t -= dt;
  if (state.mode === 'body') {
    trackFrame();
    const lost = poseLandmarker && nowMs - lastSeen > 2500;
    document.getElementById('findPlayer').style.display = (lost && state.phase === 'play') ? 'block' : 'none';
    if (shoulderW > 0.26 && nowMs - lastSeen < 500) { if (!tooCloseSince) tooCloseSince = nowMs; }
    else if (shoulderW < 0.21 || lost) { tooCloseSince = 0; }
    const tooCloseNow = !!tooCloseSince && nowMs - tooCloseSince > 400;
    if (state.phase === 'play') {
      if (tooCloseNow && nowMs >= pauseUntil) { pauseUntil = nowMs + 5000; sfxAlarm(); say('s16', { gap: 0, priority: 2 }); }
      state.paused = nowMs < pauseUntil;
    } else state.paused = false;
    document.getElementById('tooClose').style.display = state.paused ? 'flex' : 'none';
    if (state.paused) { const remain = Math.ceil((pauseUntil - nowMs) / 1000); document.getElementById('pauseCount').textContent = remain > 0 ? remain : ''; }
    if (wasPaused && !state.paused) { say('s17', { gap: 0 }); fxs.length = 0; particles.length = 0; state.fireworks = []; }   // 清場、保留進度
    wasPaused = state.paused;
  }
  if (state.paused) { waterSfx.setVol(0); return; }
  if (state.phase !== 'play') return;

  // 輸入：依階段只讀一種訊號
  const inSeek = state.step === 'seek';
  if (inSeek && state.mode === 'body') state.truckTargetX = clamp(0.15 + personX * 0.70, 0.15, 0.85);
  const squatNow = state.mode === 'body' ? squat : touchHold;
  const armsNow = state.mode === 'body' ? armsUp : touchHold;

  // 消防車移動（平滑＋後仰／回彈）
  const prevX = state.truckX;
  state.truckX += (state.truckTargetX - state.truckX) * Math.min(1, dt * 5);
  state.truckVX = (state.truckX - prevX) / Math.max(dt, 1e-3);
  state.truckLean += (clamp(-state.truckVX * 0.6, -0.12, 0.12) - state.truckLean) * Math.min(1, dt * 8);
  if (truckShake > 0) truckShake -= dt;
  if (fgBounce > 0) fgBounce -= dt;
  if (hydrant.sneeze > 0) hydrant.sneeze -= dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 16);
  state.houseFade = Math.min(1, state.houseFade + dt * 1.5);
  if (Math.random() < dt * 0.12) sfxSiren();

  const tg = state.target;
  const tx = tg ? tg.x : W / 2;
  const cannonX = state.truckX * W + (TRUCK.cannon[0] - 0.5) * TH() * (has('VH001') ? ART.VH001.ar : 1.8);
  let wantWater = 0, wantLen = TH() * 0.35;

  switch (state.step) {

      if (Math.abs(state.truckVX) > 0.02) state.idleT = 0;
      if (state.idleT > 5) { say('s3', { gap: 9000 }); state.idleT = 2; }
      // 測試水柱：短短的、規律伸縮；沒對準就落成水花

      if (state.stepT > 1.2 && Math.abs(cannonX - tx) < W * 0.07) { setStep('lock'); state.truckTargetX = state.truckX + (tx - cannonX) / W; sfxLock(); say('s5', { gap: 0, priority: 2 }); }

    ctx.globalAlpha = Math.min(1, caption.t * 2);
    ctx.font = `bold ${v * 0.05}px "Microsoft JhengHei","Noto Sans TC",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(caption.text).width + v * 0.06;
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, H * 0.95 - v * 0.04, tw, v * 0.08, v * 0.04); ctx.fill();
    ctx.fillStyle = '#1d3a5a'; ctx.fillText(caption.text, W / 2, H * 0.95);
    ctx.globalAlpha = 1;
  }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const shx = state.shake > 0 ? (Math.random() - 0.5) * state.shake * H * 0.003 : 0;
  ctx.translate(shx, 0);
  drawBackground();
  drawHouses();
  drawStation();
  drawStreet();
  drawCushion();
  drawTargetWindow();
  drawHydrant();
  drawTruck();
  drawFireworks();
  drawHats();
  drawFx();
  drawForeground();
  drawHUD();
}

/* ================== 主迴圈 ================== */
function onResize() {
  W = window.innerWidth; H = window.innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
window.addEventListener('resize', onResize);
onResize();
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (state.phase !== 'menu') { update(dt, now); draw(); }
  requestAnimationFrame(loop);
}
loadArt().then(() => { if (has('BG001')) document.getElementById('startBg').style.backgroundImage = 'url(pic/opt/BG001.webp?v=' + ART_VER + ')'; });
loadVoices();
requestAnimationFrame(loop);

// 測試勾子：分頁在背景時 rAF 不跑，用這個直接推進模擬（只給自動化驗證用）
window.__dbg = { state, particles, fxs, IMG, say, HOUSES, TRUCK, houseRect, windowPos };
window.__sim = (sec, input = {}) => {
  if (input.personX != null) personX = input.personX;
  if (input.squat != null) { squat = input.squat; isSquatHeld = input.squat; }
  if (input.armsUp != null) armsUp = input.armsUp;
  if (input.hold != null) touchHold = input.hold;
  if (input.targetX != null) state.truckTargetX = input.targetX;
  const steps = Math.round(sec * 60);
  for (let i = 0; i < steps; i++) update(1 / 60, performance.now() + i * 16.7);
  draw();
  return { step: state.step, stepT: +state.stepT.toFixed(2), truckX: +state.truckX.toFixed(3), target: state.target && { x: +(state.target.x / W).toFixed(3), roof: state.target.roof, animal: state.target.animal.id }, fire: +state.fire.toFixed(2), seats: state.seats.map(s => s.id), ladder: +state.ladder.toFixed(2), cushion: +state.cushion.toFixed(2), station: state.stationAnimals.length, total: state.rescuedTotal };
};
</script>
