<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2e9e4f">

<title>🐿️ 超級松鼠小旋風</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #bfe8ff; touch-action: none; }
  body { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none;
         color: #fff; text-shadow: 0 2px 6px rgba(20,60,20,.6); font-weight: bold; }
  #hudL { position: absolute; top: 2.2vmin; left: 2.4vmin; font-size: clamp(16px, 4.6vmin, 42px); }
  #hudRound { position: absolute; top: 8.6vmin; left: 2.4vmin; font-size: clamp(12px, 3vmin, 24px); color: #eaffd8; }
  #hudBarWrap { position: absolute; top: 1.8vmin; left: 50%; transform: translateX(-50%);
                width: min(50vw, 420px); height: clamp(18px, 3.2vmin, 28px);
                background: rgba(0,0,0,.28); border-radius: 999px; overflow: hidden; }
  #hudBarFill { height: 100%; width: 0%; border-radius: 999px;
                background: linear-gradient(90deg, #7ee36a, #2e9e4f); transition: width .15s linear; }
  #hudBarIcon { position: absolute; top: 50%; transform: translate(-50%,-54%); left: 0%;
                font-size: clamp(14px, 3vmin, 26px); transition: left .15s linear; }
  #hudBarFlag { position: absolute; right: 6px; top: 50%; transform: translateY(-52%); font-size: clamp(12px, 2.6vmin, 22px); }
  #enWrap { position: absolute; top: 6.2vmin; left: 50%; transform: translateX(-50%);
            width: min(38vw, 320px); height: clamp(14px, 2.6vmin, 22px);
            background: rgba(0,0,0,.28); border-radius: 999px; overflow: hidden; }
  #enFill { height: 100%; width: 0%; border-radius: 999px;
            background: linear-gradient(90deg, #ffd24a, #ff8a1a); transition: width .12s linear; }
  #enWrap.full { animation: enPulse .5s ease-in-out infinite alternate; }
  @keyframes enPulse { from { box-shadow: 0 0 0 rgba(255,210,74,.0) } to { box-shadow: 0 0 3vmin rgba(255,210,74,.95) } }
  #enText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: clamp(10px, 2vmin, 16px); }
  #stepTip { position: absolute; top: 10.6vmin; left: 50%; transform: translateX(-50%);
             font-size: clamp(15px, 4.2vmin, 34px); white-space: nowrap; text-align: center; }

  #pip { position: fixed; left: 12px; bottom: 12px; width: 160px; height: 120px;
    border: 3px solid rgba(255,255,255,.6); border-radius: 12px; overflow: hidden;
    display: none; z-index: 20; background: #000; }
  #pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #pipDot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 8px #00ff88; transform: translate(-50%,-50%);
    transition: left .1s linear, top .1s linear, background .1s linear; }
  #pipHide { position: absolute; top: 2px; right: 2px; width: 28px; height: 28px;
    background: rgba(0,0,0,.5); color: #fff; border: none; border-radius: 8px; font-size: 14px; }

  .overlay { position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; }
  #startOverlay { background: linear-gradient(180deg, #57c1ff 0%, #9fe0ff 34%, #bfeE9a 66%, #7ccb5e 100%); padding: 2vmin; overflow: hidden; }
  #startOverlay h1 { font-size: clamp(22px, 8.4vmin, 62px); margin-bottom: 0.6vmin; color: #fff; text-shadow: 0 3px 14px rgba(20,80,20,.55); }
  #startChars { display: flex; align-items: flex-end; justify-content: center; gap: 2vmin; margin-bottom: 0.6vmin; }
  #startChars img { image-rendering: auto; }
  #imgHero { width: clamp(90px, 26vmin, 220px); animation: sway 1.6s ease-in-out infinite; }
  .imgPup { width: clamp(50px, 14vmin, 120px); animation: hop 1.2s ease-in-out infinite; }
  .imgPup.b { animation-delay: .6s; }
  @keyframes sway { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-1.4vmin) rotate(3deg) } }
  @keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1vmin) } }
  .btn { margin: 1vmin; padding: 1.8vmin 5vmin; font-size: clamp(15px, 5vmin, 32px); font-weight: bold;
    color: #fff; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 0.6vmin 0 rgba(0,0,0,.35); }
  .btn:active { transform: translateY(0.4vmin); box-shadow: 0 0.2vmin 0 rgba(0,0,0,.35); }
  #btnBody  { background: linear-gradient(180deg, #ff8a3d, #e06010); }
  #btnTouch { background: linear-gradient(180deg, #35b46a, #1c8a48); }
  #startOverlay .hint { margin-top: 1vmin; font-size: clamp(10px, 3vmin, 18px); color: #fff; max-width: 94%; line-height: 1.6; text-shadow: 0 1px 4px rgba(20,80,20,.6); }

  #rotateHint { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: rgba(0,0,0,.7); color: #ffee66; text-align: center;
    font-size: clamp(14px, 4vmin, 22px); font-weight: bold; padding: 2vmin; pointer-events: none; }
  @media (orientation: portrait) { #rotateHint { display: block; } }

  #loadingOverlay { background: rgba(30,110,50,.94); display: none; }
  #loadingOverlay .spin { font-size: 70px; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  #loadingOverlay p { margin-top: 16px; font-size: 24px; }

  #findPlayer { position: fixed; inset: auto 0 18% 0; z-index: 25; display: none; text-align: center; pointer-events: none; }
  #findPlayer .bubble { display: inline-block; background: rgba(255,255,255,.92); color: #333;
    font-size: clamp(24px, 5vw, 40px); font-weight: bold; padding: 18px 36px; border-radius: 24px;
    animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  #tooClose { position: fixed; inset: 0; z-index: 26; display: none;
    align-items: center; justify-content: center; pointer-events: none; background: rgba(180, 40, 0, .3); }
  #tooClose .bubble { background: rgba(255,255,255,.95); color: #d3322a; text-align: center;
    font-size: clamp(26px, 8vmin, 60px); font-weight: bold; padding: 4vmin 7vmin; border-radius: 4vmin; line-height: 1.5;
    animation: bounce 1s ease-in-out infinite; }
  #tooClose .count { font-size: clamp(44px, 16vmin, 120px); color: #ff8800; line-height: 1.2; }

  #countdown { position: fixed; inset: 0; z-index: 28; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #countdown span { font-size: clamp(80px, 38vmin, 300px); font-weight: bold; color: #ffee44;
    text-shadow: 0 0 50px #ff8800, 0 4px 10px rgba(0,0,0,.5); }

  #zoneToast { position: fixed; top: 16vmin; left: 50%; transform: translateX(-50%); z-index: 27; pointer-events: none;
    background: rgba(20,90,30,.66); color: #fff; font-weight: bold; padding: 1.3vmin 3.6vmin; border-radius: 999px;
    font-size: clamp(15px, 3.8vmin, 32px); opacity: 0; transition: opacity .3s; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0,0,0,.4); }

  /* 手指模式的大按鈕 */
  .padBtn { position: fixed; bottom: 3vmin; z-index: 22; display: none;
    width: clamp(64px, 17vmin, 120px); height: clamp(64px, 17vmin, 120px); border-radius: 50%;
    font-size: clamp(28px, 8vmin, 56px); border: none; color: #fff; font-weight: bold;
    box-shadow: 0 0.8vmin 0 rgba(0,0,0,.4); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .padBtn:active { transform: translateY(0.4vmin) scale(.94); }
  #btnJump { right: 3vmin; background: radial-gradient(circle at 40% 35%, #6fd0ff, #1c6dd0); }
  #btnCrouch { right: calc(6vmin + clamp(64px, 17vmin, 120px)); background: radial-gradient(circle at 40% 35%, #ffc36a, #d07a10); }
  #btnHero { position: fixed; right: 3vmin; bottom: calc(6vmin + clamp(64px, 17vmin, 120px)); z-index: 22; display: none;
    width: clamp(64px, 17vmin, 120px); height: clamp(64px, 17vmin, 120px); border-radius: 50%;
    font-size: clamp(28px, 8vmin, 56px); border: none; color: #fff;
    background: radial-gradient(circle at 40% 35%, #ffe14d, #ff8a1a);
    box-shadow: 0 0.8vmin 0 rgba(0,0,0,.4), 0 0 3vmin rgba(255,210,74,.9); cursor: pointer;
    animation: enPulse .5s ease-in-out infinite alternate; }
  #btnHero:active { transform: translateY(0.4vmin) scale(.94); }

  #winOverlay { display: none; background: rgba(20, 80, 30, .35); z-index: 32; }
  #winOverlay .btn { background: linear-gradient(180deg, #ff8a3d, #e06010); }

  /* 密碼鎖 */
  #lockOverlay { background: linear-gradient(180deg, #2b5f8a 0%, #57c1ff 60%, #9fe0ff 100%); z-index: 50; }
  #lockOverlay .lockIcon { font-size: clamp(56px, 16vmin, 130px); animation: sway 1.8s ease-in-out infinite; }
  #lockOverlay h2 { font-size: clamp(20px, 6vmin, 44px); margin: 1vmin 0; text-shadow: 0 2px 10px rgba(0,40,80,.5); }
  #lockOverlay .lockHint { font-size: clamp(14px, 3.6vmin, 26px); color: #eaf6ff; margin-bottom: 2vmin; text-shadow: 0 1px 4px rgba(0,40,80,.5); }
  #pwInput { font-size: clamp(18px, 5vmin, 34px); padding: 1.4vmin 3vmin; border: none; border-radius: 999px;
    text-align: center; width: min(70vw, 420px); outline: none; font-weight: bold; color: #1c5a8a;
    box-shadow: 0 0.5vmin 0 rgba(0,0,0,.25); }
  #pwWrap.no { animation: shakeX .4s; }
  @keyframes shakeX { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-3vmin) } 75% { transform: translateX(3vmin) } }
  #pwMsg { min-height: 5vmin; font-size: clamp(14px, 4vmin, 28px); margin-top: 1.5vmin; font-weight: bold; }
</style>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hudL"><span id="hCones">🌰 0</span></div>

  <div id="hudBarWrap"><div id="hudBarFill"></div><span id="hudBarIcon">🐿️</span><span id="hudBarFlag">🚩</span></div>

  <div id="startChars">
    <img class="imgPup" src="pic/opt/CHAR102.png?v=1" alt="">
    <img id="imgHero" src="pic/opt/CHAR001.png?v=1" alt="">
    <img class="imgPup b" src="pic/opt/CHAR202.png?v=1" alt="">
  </div>
  <h1>超級松鼠小旋風</h1>
  <button class="btn" id="btnBody">🏃 用身體玩（站在電視前）</button>
  <button class="btn" id="btnTouch">👆 用手指玩</button>
  <div class="hint">🐿️ 小旋風會自動往前跑！石頭木樁 <b>跳</b> 過去、蜜蜂小鳥 <b>蹲</b> 下躲、沿路收集松果 🌰。<br>能量滿了 <b>雙手舉高高</b> 變身英雄模式，咻～把障礙全部撞飛 💥！<br>撞到了也沒關係：跌倒了，就馬上站起來，衝衝衝！<br>影像只在裝置上運算，不會上傳。</div>
</div>

<script>
/* ================== 基本設定 ================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const chance = p => Math.random() < p;
const GAME_VER = 3;

/* ================== 音效（WebAudio 合成） ================== */
let AC = null;
function audioInit() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, type = 'sine', vol = 0.25, when = 0) {
  if (!AC || freq <= 0) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + when + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime + when); o.stop(AC.currentTime + when + dur + 0.05);
}
function sweep(f0, f1, dur, type, vol) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur + 0.05);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur + 0.1);
}
function noiseBurst(dur, vol, f = 900) {
  if (!AC) return;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start();
}
function sfxJump()    { sweep(280, 720, 0.22, 'sine', 0.18); tone(160, 0.08, 'square', 0.08); }
function sfxLand()    { tone(120, 0.1, 'sine', 0.14); noiseBurst(0.08, 0.05, 500); }
function sfxCrouch()  { sweep(500, 240, 0.14, 'sine', 0.1); }
function sfxCollect() { tone(880, 0.09, 'triangle', 0.2); tone(1319, 0.14, 'triangle', 0.12, 0.06); }
function sfxGold()    { [784, 988, 1319, 1568].forEach((f, i) => tone(f, 0.12, 'triangle', 0.16, i * 0.06)); }
function sfxHit()     { sweep(400, 70, 0.3, 'square', 0.22); noiseBurst(0.2, 0.16, 1200); }
function sfxRoll()    { [90, 70, 90, 70].forEach((f, i) => tone(f, 0.12, 'sawtooth', 0.1, i * 0.12)); }
function sfxDizzy()   { [660, 550, 440, 330].forEach((f, i) => tone(f, 0.16, 'sine', 0.1, i * 0.14)); }
function sfxStand()   { sweep(200, 560, 0.2, 'triangle', 0.14); }
function sfxHero()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.2, i * 0.08)); sweep(300, 1200, 0.5, 'sawtooth', 0.06); }
function sfxHeroEnd() { sweep(900, 300, 0.4, 'triangle', 0.1); }
function sfxSmash()   { sweep(500, 90, 0.25, 'square', 0.2); noiseBurst(0.16, 0.14, 1600); }
function sfxVictory() { tone(196, 1.4, 'sine', 0.28); [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.24,'triangle',0.16,0.15+i*0.11)); }
function sfxCrowd() {   // 群眾歡呼：聲浪 + 口哨 + 劈啪掌聲
  if (!AC) return;
  const dur = 2.8;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
  const g = AC.createGain();
  const t0 = AC.currentTime;
  g.gain.setValueAtTime(0.001, t0);
  g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.4);
  g.gain.setValueAtTime(0.3, t0 + 1.5);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); s.stop(t0 + dur + 0.1);
  sweep(900, 1900, 0.28, 'sine', 0.1);
  setTimeout(() => sweep(1000, 2100, 0.3, 'sine', 0.09), 400);
  for (let i = 0; i < 14; i++) setTimeout(() => noiseBurst(0.03, 0.09, 2600), 150 + Math.random() * 2000);
}
function sfxAlarm()   { [0, 0.4, 0.8].forEach(d => { tone(880, 0.2, 'square', 0.26, d); tone(587, 0.2, 'square', 0.26, d + 0.2); }); }
function sfxFull()    { [988, 1319].forEach((f,i)=>tone(f,0.14,'triangle',0.18,i*0.1)); }

/* 台詞語音：mic/ 錄音檔（對照表見 mic/對照.txt）
   不排隊（新台詞取消舊的）、重要台詞優先、支援序列播放（s1→s2） */
const lastSay = {};
const VOICE = {};
for (let i = 1; i <= 18; i++) {
  const a = new Audio('mic/s' + i + '.mp3?v=' + GAME_VER);
  a.preload = 'auto';
  VOICE['s' + i] = a;
}
let sayCur = null;   // { pri, el }
function say(keys, pri = 1) {
  if (sayCur && sayCur.pri > pri) return;            // 更重要的還在講 → 小台詞跳過
  if (sayCur) { try { sayCur.el.pause(); } catch (e) {} sayCur = null; }
  const seq = Array.isArray(keys) ? keys.slice() : [keys];
  const playNext = () => {
    const k = seq.shift();
    if (!k) { sayCur = null; return; }
    const el = VOICE[k];
    if (!el) { playNext(); return; }
    try {
      el.currentTime = 0;
      sayCur = { pri, el };
      el.onended = () => { if (sayCur && sayCur.el === el) playNext(); };
      el.play().catch(() => { if (sayCur && sayCur.el === el) sayCur = null; });
    } catch (e) { sayCur = null; }
  };
  playNext();
}
function sayT(key, keys, gap = 2500, pri = 1) {
  const n = performance.now();
  if (lastSay[key] && n - lastSay[key] < gap) return;
  lastSay[key] = n; say(keys, pri);
}

/* ================== 圖片素材 ================== */
const IMG = {};
const IMG_LIST = ['BG001.jpg','BG002.png','CHAR001.png','CHAR002.png','CHAR003.png','CHAR004.png','CHAR005.png',
  'CHAR006.png','CHAR007.png','CHAR008.png','CHAR009.png','CHAR010.png','CHAR011.png','CHAR012.png',
  'RUN1.png','RUN2.png','RUN3.png','RUN4.png','CHAR101.png','CHAR102.png','CHAR201.png','CHAR202.png',
  'BG003.png','BG004.png','OBS001.png','OBS002.png','OBS003.png','OBS101.png','OBS102.png','OBS103.png','ITEM001.png','ITEM002.png'];
// RUN1~4 = 跑步改善四影格（576x384 橫幅，含尾巴）
const has = im => im && im.complete && im.naturalWidth > 0;
let imgsReady = false;
function loadImages(onProgress) {
  let done = 0;
  return Promise.all(IMG_LIST.map(name => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = () => { done++; onProgress && onProgress(done, IMG_LIST.length); res(); };
    im.src = 'pic/opt/' + name + '?v=' + GAME_VER;
    IMG[name.split('.')[0]] = im;
  }))).then(() => { imgsReady = true; measurePads(); });
}
/* 量每張圖「內容底部到圖框底部」的透明邊距比例，存在 img._pad。
   畫的時候往下補償，蹲下/坐地等影格才會真的貼地不浮空 */
function measurePads() {
  const S = 64;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  for (const name of Object.keys(IMG)) {
    const im = IMG[name];
    if (!has(im) || im._pad != null) continue;
    x.clearRect(0, 0, S, S);
    x.drawImage(im, 0, 0, S, S);
    let d;
    try { d = x.getImageData(0, 0, S, S).data; } catch (e) { continue; }
    let bottom = -1;
    for (let yy = S - 1; yy >= 0 && bottom < 0; yy--)
      for (let xx = 0; xx < S; xx++)

    im._pad = bottom < 0 ? 0 : (S - 1 - bottom) / S;
  }
}

/* ================== 世界狀態 ================== */
const state = {
  phase: 'menu',      // menu / countdown / play / victory
  mode: null,         // body / touch
  run: 'run',         // run / jump / crouch / hit / roll / dizzy / standup / heroPose
  t: 0, stT: 0,       // stT = 目前 run 狀態經過時間
  round: 1,
  cones: 0, energy: 0, hero: 0, heroHold: 0,
  dist: 0, prog: 0, flag: null, finished: false,
  vy: 0, py: 0,       // py = 離地高度（畫面座標，向上為正）
  crouchHold: false, invinc: 0,
  toastT: 0, paused: false, slow: 0,
};
const ENERGY_MAX = 8, HERO_TIME = 9, LEVEL_T = 75;
let SPD = 0, GYv = 0, SQ = 0;     // 由 onResize 計算
function baseSpeed() { return H * 0.52 * (1 + (state.round - 1) * 0.12); }
function speedNow() {
  let v = baseSpeed();
  if (state.hero > 0) v *= 1.5;
  if (['hit', 'roll'].includes(state.run)) v *= 0.35;
  if (['dizzy', 'standup', 'heroPose'].includes(state.run)) v *= 0;
  if (state.phase !== 'play' || state.paused) v = 0;
  return v;
}

/* 視差捲動量 */
let scrollFar = 0, scrollMid = 0, scrollGnd = 0;
/* 世界物件 */
let obstacles = [];   // {type,x,y,w,h,frameT,dead}

let tufts = [];       // 前景草叢 {x,k}
let midTrees = [];    // 中景樹 {x,k}
let particles = [];   // {x,y,vx,vy,life,max,type,col,size,rot,vr}
let trail = [];       // 英雄模式殘影 {x,y,img,life}
let ambBirds = [];    // 背景裝飾小鳥

/* ================== 粒子特效 ================== */
function burst(x, y, n, type, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = opt.a != null ? opt.a + rnd(-0.6, 0.6) : rnd(0, Math.PI * 2);
    const sp = (opt.sp || H * 0.4) * rnd(0.4, 1.1);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.up || H * 0.25),
      life: opt.life || 0.8, max: opt.life || 0.8, type,
      col: opt.col || '#ffe14d', size: (opt.size || H * 0.02) * rnd(0.7, 1.3),
      rot: rnd(0, 6.3), vr: rnd(-6, 6), grav: opt.grav ?? H * 1.2,
    });
  }
}
function drawStar(x, cx, cy, r, rot, col) {
  x.save(); x.translate(cx, cy); x.rotate(rot); x.fillStyle = col; x.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    x[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); }
  x.closePath(); x.fill(); x.restore();
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt;
    p.rot += p.vr * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.type === 'star') drawStar(ctx, p.x, p.y, p.size, p.rot, p.col);
    else if (p.type === 'dust') ell(ctx, p.x, p.y, p.size * (1.6 - p.life / p.max), p.size * (1.2 - p.life / p.max * 0.6), 'rgba(222,205,170,.8)');
    else if (p.type === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); ctx.restore(); }
    else { ell(ctx, p.x, p.y, p.size, p.size, p.col); }
  }
  ctx.globalAlpha = 1;
}

/* ================== 生成器 ================== */
let spawnT = 0, lastHazardGround = false, hazardCount = 0, taughtJump = false, taughtCrouch = false;
const zoneToast = document.getElementById('zoneToast');
function toast(txt, secs = 2.4) { zoneToast.textContent = txt; state.toastT = secs; }

function groundY() { return GYv; }
function spawnHazard() {
  const groundKinds = ['rock', 'stump', 'log'], airKinds = ['bee', 'branch', 'bird'];
  const useAir = hazardCount >= 2 && (lastHazardGround ? chance(0.55) : chance(0.35));
  const kind = pick(useAir ? airKinds : groundKinds);
  lastHazardGround = !useAir; hazardCount++;
  const o = { type: kind, x: W + H * 0.3, frameT: 0, dead: false };
  if (kind === 'rock')   { o.w = H * 0.15; o.h = H * 0.115; }
  if (kind === 'stump')  { o.w = H * 0.13; o.h = H * 0.15; }
  if (kind === 'log')    { o.w = H * 0.21; o.h = H * 0.10; }
  if (kind === 'bee')    { o.w = H * 0.13; o.h = H * 0.11; }
  if (kind === 'bird')   { o.w = H * 0.14; o.h = H * 0.11; }
  if (kind === 'branch') { o.w = H * 0.30; o.h = H * 0.11; }
  o.air = useAir;
  // 空中障礙底部在 GY-0.175H：站立（頭頂 GY-0.24H）必撞、蹲下（GY-0.145H）安全通過
  o.y = useAir ? groundY() - H * 0.175 - o.h : groundY() - o.h; // y = 上緣
  obstacles.push(o);
  if (!useAir && !taughtJump) { taughtJump = true; toast('🪨 障礙來了！用力跳過去 ⬆️'); sayT('tJump', 's3', 1200, 2); }   // 跳過去！
  if (useAir && !taughtCrouch) { taughtCrouch = true; toast('🐝 小心上面！蹲下躲 ⬇️'); sayT('tCrouch', 's4', 1200, 2); }  // 蹲下躲開！
}
function spawnCones() {
  const style = pick(['line', 'arc', 'low']);
  const bx = W + H * 0.3, g = chance(0.16);
  if (style === 'arc') {
    for (let i = 0; i < 5; i++) {
      const fx = i / 4, y = groundY() - H * 0.1 - Math.sin(fx * Math.PI) * H * 0.27;
      items.push({ x: bx + fx * H * 0.55, y, gold: g && i === 2, t: rnd(0, 6), dead: false });
    }
  } else if (style === 'low') {
    for (let i = 0; i < 3; i++) items.push({ x: bx + i * H * 0.14, y: groundY() - H * 0.09, gold: false, t: rnd(0, 6), dead: false });
  } else {
    for (let i = 0; i < 4; i++) items.push({ x: bx + i * H * 0.15, y: groundY() - H * 0.16, gold: g && i === 1, t: rnd(0, 6), dead: false });
  }
}
function spawnTick(dt) {
  if (state.finished) return;
  spawnT -= dt * (speedNow() / baseSpeed());
  if (spawnT > 0) return;
  const early = state.round === 1 && state.t < 8;
  if (early) { spawnCones(); spawnT = 1.6; return; }
  if (lastSpawnHazard && chance(0.72)) { spawnCones(); lastSpawnHazard = false; spawnT = rnd(1.3, 1.8); }
  else { spawnHazard(); lastSpawnHazard = true; spawnT = rnd(1.9, 2.6) * Math.max(0.72, 1 - (state.round - 1) * 0.06); }
}
let lastSpawnHazard = false;

/* ================== 玩家 ================== */
function playerX() { return W * 0.24; }
function playerBox() {
  const crouch = state.run === 'crouch';
  const h = crouch ? H * 0.145 : H * 0.24;
  const w = H * 0.13;
  const bottom = groundY() - state.py;
  return { x: playerX() - w / 2, y: bottom - h, w, h };
}
function doJump() {
  if (state.phase !== 'play' || state.paused) return;
  if (!['run', 'crouch'].includes(state.run) || state.py > 1) return;
  state.run = 'jump'; state.stT = 0;
  state.vy = H * 1.65; sfxJump();
  burst(playerX(), groundY(), 5, 'dust', { sp: H * 0.2, up: H * 0.06, life: 0.5, grav: H * 0.3 });
}
function setCrouch(on) { state.crouchHold = on; }
function startHit() {
  if (state.invinc > 0 || state.hero > 0) return;
  state.run = 'hit'; state.stT = 0; state.vy = H * 0.7; sfxHit();
  burst(playerX() + H * 0.08, groundY() - H * 0.18, 8, 'star', { sp: H * 0.5, life: 0.6 });
  sayT('hit', pick(['s5', 's6', 's7', 's8']), 1500, 2);   // 哎呀撞到了 / 啊！ / 好痛痛 / 哇翻滾囉
  shake = 0.7;
}
function heroReady() { return state.energy >= ENERGY_MAX && state.hero <= 0 && ['run', 'crouch', 'jump'].includes(state.run); }
function activateHero() {
  if (!heroReady()) return;
  state.energy = 0; state.heroHold = 0;
  state.run = 'heroPose'; state.stT = 0; state.py = 0; state.vy = 0;
  sfxHero(); say('s2', 3);   // 衝衝衝！超級松鼠小旋風！
  burst(playerX(), groundY() - H * 0.2, 14, 'star', { sp: H * 0.7, life: 0.9 });
}

/* ================== 撞擊 / 收集判定 ================== */
function rectHit(a, b, shrink = 0.22) {
  const sx = b.w * shrink, sy = b.h * shrink;
  return a.x < b.x + b.w - sx && a.x + a.w > b.x + sx && a.y < b.y + b.h - sy && a.y + a.h > b.y + sy;
}
function collideTick() {
  if (state.phase !== 'play') return;
  const pb = playerBox();
  for (const o of obstacles) {
    if (o.dead) continue;
    const ob = { x: o.x, y: o.y + (o.air ? Math.sin(o.frameT * 3) * H * 0.008 : 0), w: o.w, h: o.h };
    if (!rectHit(pb, ob)) continue;
    if (state.hero > 0) {
      o.dead = true; sfxSmash();
      burst(o.x + o.w / 2, o.y + o.h / 2, 10, 'star', { sp: H * 0.6, life: 0.8 });
      state.cones++;
      sayT('smash', pick(['s12', 's13', 's14']), 1800, 0);   // 碰！ / 咻！ / 太強啦！
    } else if (state.invinc <= 0 && ['run', 'jump', 'crouch'].includes(state.run)) {
      startHit(); break;
    }
  }
  for (const it of items) {
    if (it.dead) continue;
    const dx = it.x - playerX(), dy = it.y - (groundY() - state.py - H * 0.12);
    if (dx * dx + dy * dy < (H * 0.11) ** 2) {
      it.dead = true;
      state.cones += it.gold ? 3 : 1;
      const before = state.energy;
      state.energy = Math.min(ENERGY_MAX, state.energy + (it.gold ? 3 : 1));
      it.gold ? sfxGold() : sfxCollect();
      burst(it.x, it.y, it.gold ? 8 : 4, 'star', { sp: H * 0.3, life: 0.5, col: it.gold ? '#ffd24a' : '#ffe9a8', size: H * 0.014 });
      if (state.energy >= ENERGY_MAX && before < ENERGY_MAX) {
        sfxFull();
        say(state.mode === 'body' ? 's10' : 's11', 2);   // 能量滿了！雙手舉高高／按閃電按鈕
      }
    }
  }
}

/* ================== 玩家狀態機 ================== */
function runStateTick(dt) {
  state.stT += dt;
  const s = state.run;
  if (s === 'jump') {
    state.py += state.vy * dt; state.vy -= H * 4.4 * dt;
    if (state.py <= 0) { state.py = 0; state.run = 'run'; state.stT = 0; sfxLand();
      burst(playerX(), groundY(), 4, 'dust', { sp: H * 0.16, up: H * 0.04, life: 0.4, grav: H * 0.3 }); }
  } else if (s === 'run' || s === 'crouch') {
    state.py = 0;
    const want = state.crouchHold ? 'crouch' : 'run';
    if (want !== s) { state.run = want; state.stT = 0; if (want === 'crouch') sfxCrouch(); }
  } else if (s === 'hit') {
    state.py += state.vy * dt; state.vy -= H * 3.4 * dt;
    if (state.py < 0) state.py = 0;
    if (state.stT > 0.45) { state.run = 'roll'; state.stT = 0; state.py = 0; sfxRoll(); }
  } else if (s === 'roll') {
    if (state.stT > 0.75) { state.run = 'dizzy'; state.stT = 0; sfxDizzy(); }
  } else if (s === 'dizzy') {
    if (state.stT > 1.05) { state.run = 'standup'; state.stT = 0; sfxStand();
      sayT('stand', 's9', 4000, 2); }   // 跌倒了，就馬上站起來！衝衝衝！
  } else if (s === 'standup') {
    if (state.stT > 0.55) { state.run = 'run'; state.stT = 0; state.invinc = 1.2;
      burst(playerX(), groundY(), 6, 'dust', { sp: H * 0.2, up: H * 0.05, life: 0.5, grav: H * 0.3 }); }
  } else if (s === 'heroPose') {
    if (state.stT > 0.7) { state.run = 'run'; state.stT = 0; state.hero = HERO_TIME; }
  }
  if (state.invinc > 0) state.invinc -= dt;
  if (state.hero > 0) {
    state.hero -= dt;
    if (state.hero <= 0) { state.hero = 0; sfxHeroEnd(); sayT('heroEnd', 's15', 3000); }   // 繼續跑！
  }
}

/* ================== 體感追蹤（MediaPipe Pose） ================== */
const video = document.getElementById('cam');
const pip = document.getElementById('pip');
const pipDot = document.getElementById('pipDot');
let poseLandmarker = null;
let lastVideoTime = -1, lastSeen = 0;
let personX = 0.5, shoulderW = 0, armsUp = false, squatting = false;
let bodyRatioBase = 0;
let hipS = 0, hipBase = 0, hipPrevT = 0, jumpCool = 0, jumpFlash = 0;
let tooCloseSince = 0, pauseUntil = 0, wasPaused = false;

async function setupBodyTracking() {
  const loadingText = document.getElementById('loadingText');
  loadingText.textContent = '正在啟動鏡頭…';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();
  loadingText.textContent = '正在載入 AI 模型…（第一次會久一點）';
  const { PoseLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate: 'GPU' },
    runningMode: 'VIDEO', numPoses: 1,
  });
  pip.style.display = 'block';
}
function trackFrame() {
  if (!poseLandmarker || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let result;
  try { result = poseLandmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
  const lm = result.landmarks && result.landmarks[0];
  if (!lm) return;
  const now = performance.now(); lastSeen = now;
  const scx = (lm[11].x + lm[12].x) / 2, scy = (lm[11].y + lm[12].y) / 2;
  personX = 1 - scx;
  shoulderW = Math.abs(lm[11].x - lm[12].x);
  const sw = Math.max(0.05, shoulderW);
  // 雙手高舉（英雄模式用）
  const band = sw * 0.5;
  armsUp = (scy - lm[15].y) > band && (scy - lm[16].y) > band;
  // 蹲下：腳踝~肩的身高（除肩寬正規化）低於站姿基準
  const ankY = (lm[27].y + lm[28].y) / 2;
  const ratio = (ankY - scy) / sw;
  if (ratio > 0.5 && ratio < 12) {
    if (ratio > bodyRatioBase) bodyRatioBase += (ratio - bodyRatioBase) * 0.06;
    else bodyRatioBase += (ratio - bodyRatioBase) * 0.01;
    const thr = squatting ? 0.90 : 0.80;
    squatting = bodyRatioBase > 1 && ratio < bodyRatioBase * thr;
  }
  // 跳：髖部中心快速上升（時間性速度偵測）
  const hy = (lm[23].y + lm[24].y) / 2;
  const dtT = hipPrevT ? Math.min(0.2, (now - hipPrevT) / 1000) : 0.033;
  const prev = hipS || hy;
  hipS = prev + (hy - prev) * 0.55;
  const vy = (prev - hipS) / dtT;          // 正值 = 往上
  hipPrevT = now;
  if (!hipBase) hipBase = hipS;
  if (hipS > hipBase) hipBase += (hipS - hipBase) * 0.08;   // 回到站姿：快速跟上
  else hipBase += (hipS - hipBase) * 0.012;                  // 上升中：慢慢跟，累積差值
  if (jumpCool > 0) jumpCool -= dtT;
  const rise = hipBase - hipS;
  if (jumpCool <= 0 && !squatting && rise > sw * 0.30 && vy > sw * 1.5) {
    jumpCool = 0.85; jumpFlash = 0.4; doJump();
  }
  if (jumpFlash > 0) jumpFlash -= dtT;
  pipDot.style.left = (personX * 100) + '%';
  pipDot.style.top = (squatting ? 74 : (armsUp || jumpFlash > 0) ? 20 : 50) + '%';
  pipDot.style.background = squatting ? '#ffb300' : jumpFlash > 0 ? '#6fd0ff' : armsUp ? '#ff66cc' : '#00ff88';
}

/* ================== 更新 ================== */
let shake = 0;
function update(dt) {
  state.t += dt;
  if (state.mode === 'body') {
    trackFrame();
    const nowMs = performance.now();
    const lost = poseLandmarker && nowMs - lastSeen > 2500;
    document.getElementById('findPlayer').style.display = (lost && state.phase === 'play') ? 'block' : 'none';
    if (shoulderW > 0.28 && nowMs - lastSeen < 500) { if (!tooCloseSince) tooCloseSince = nowMs; }
    else if (shoulderW < 0.23 || lost) { tooCloseSince = 0; }
    const tooCloseNow = !!tooCloseSince && nowMs - tooCloseSince > 400;
    if (state.phase === 'play') {
      if (tooCloseNow && nowMs >= pauseUntil) { pauseUntil = nowMs + 5000; sfxAlarm(); say('s17', 3); }   // 太靠近了！往後退！
      state.paused = nowMs < pauseUntil;
    } else state.paused = false;
    document.getElementById('tooClose').style.display = state.paused ? 'flex' : 'none';
    if (state.paused) { const remain = Math.ceil((pauseUntil - nowMs) / 1000); document.getElementById('pauseCount').textContent = remain > 0 ? remain : ''; }
    if (wasPaused && !state.paused) say('s18', 2);   // 好！繼續衝！
    wasPaused = state.paused;
    // 蹲下 → 角色蹲；英雄能量滿 → 雙手舉高啟動
    setCrouch(squatting);
    if (heroReady() && armsUp) { state.heroHold += dt; if (state.heroHold > 0.85) activateHero(); }
    else state.heroHold = 0;
  }
  if (state.toastT > 0) { state.toastT -= dt; zoneToast.style.opacity = state.toastT > 0 ? 1 : 0; }
  if (shake > 0) shake = Math.max(0, shake - dt * 3);

  const v = speedNow();
  scrollFar += v * 0.18 * dt; scrollMid += v * 0.5 * dt; scrollGnd += v * dt;

  if (state.phase === 'play' && !state.paused) {
    runStateTick(dt);
    spawnTick(dt);
    collideTick();
    state.dist += v * dt;
    state.prog = clamp(state.dist / (baseSpeed() * LEVEL_T), 0, 1);
    // 終點旗
    if (state.prog >= 1 && !state.flag) state.flag = { x: W + H * 0.4 };
    if (state.flag) {
      state.flag.x -= v * dt;
      if (state.flag.x < playerX() + H * 0.05) reachFinish();
    }
    // 英雄殘影
    if (state.hero > 0) {
      trail.push({ x: playerX(), y: state.py, life: 0.35, run: state.run });
      if (trail.length > 10) trail.shift();
    }
  }
  if (state.phase === 'victory') victoryTick(dt);
  for (let i = trail.length - 1; i >= 0; i--) { trail[i].life -= dt; if (trail[i].life <= 0) trail.splice(i, 1); }

  // 世界物件移動
  for (const o of obstacles) { o.x -= v * dt; o.frameT += dt; }
  obstacles = obstacles.filter(o => !o.dead && o.x > -H * 0.5);
  for (const it of items) { it.x -= v * dt; it.t += dt; }
  items = items.filter(it => !it.dead && it.x > -H * 0.3);
  for (const tf of tufts) { tf.x -= v * 1.15 * dt; if (tf.x < -H * 0.3) { tf.x += W + H * 0.6; } }
  for (const tr of midTrees) { tr.x -= v * 0.5 * dt; if (tr.x < -H * 0.5) { tr.x += W + H * 1.0; tr.k = chance(0.5) ? 0 : 1; } }
  for (const b of ambBirds) { b.x += b.sp * dt; if (b.x > W + 50) { b.x = -50; b.y = rnd(H * 0.06, H * 0.3); } }

  updateParticles(dt);
}

/* ================== 呈現 ================== */
function drawImageFit(img, x, y, w, h) { ctx.drawImage(img, x, y, w, h); }

    return { img: seq[Math.floor(t * fps) % 4], wide: true };

  if (state.hero > 0) return { img: Math.floor(t * 12) % 2 ? IMG.CHAR011 : IMG.CHAR009 };
  return { img: Math.floor(t * 9) % 2 ? IMG.CHAR011 : IMG.CHAR002 };
}
function drawPlayer() {

}
function drawObstacle(o) {
  const fr = Math.floor(o.frameT * 8) % 2;
  const bobY = o.air ? Math.sin(o.frameT * 3) * H * 0.008 : 0;
  // 接近提醒：物件周圍亮起淡淡的暖光暈，輕輕呼吸閃爍（提前約 1.2 秒）
  if (state.phase === 'play') {
    const vv = speedNow();
    if (vv > 0) {
      const eta = (o.x + o.w / 2 - playerX()) / vv;
      if (eta > 0 && eta < 1.25) {
        const warn = Math.min(1, (1.25 - eta) / 0.35);
        const cx = o.x + o.w / 2;
        const cy = o.air ? o.y + o.h / 2 + bobY : groundY() - o.h * 0.5;
        const r = Math.max(o.w, o.h) * 1.3 + H * 0.07;
        const a = 0.72 * warn * (0.78 + 0.22 * Math.sin(state.t * 7));
        const gl = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        gl.addColorStop(0, `rgba(255,250,210,${a})`);
        gl.addColorStop(0.45, `rgba(255,235,120,${a * 0.7})`);
        gl.addColorStop(1, 'rgba(255,235,120,0)');
        ctx.fillStyle = gl;
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      }
    }
  }
  const OBS_IMG = { rock: IMG.OBS001, stump: IMG.OBS002, log: IMG.OBS003, bee: IMG.OBS101, branch: IMG.OBS102, bird: IMG.OBS103 };
  const im = OBS_IMG[o.type];
  if (has(im)) {
    const asp = im.naturalWidth / im.naturalHeight;
    ctx.save();
    // 陰影光暈：讓障礙物從背景跳出來
    ctx.shadowColor = 'rgba(40,20,0,.5)'; ctx.shadowBlur = H * 0.02; ctx.shadowOffsetY = H * 0.006;
    if (o.type === 'branch') {
      // 樹枝：樹葉底部貼齊碰撞框下緣（蹲下剛好躲過），枝幹在上方
      const dh = H * 0.24, dw = dh * asp;
      ctx.drawImage(im, o.x + o.w / 2 - dw / 2, o.y + o.h + H * 0.02 - dh + bobY, dw, dh);
    } else if (o.air) {
      // 蜜蜂/小鳥：飛行擺動 + 微微傾斜
      const dh = o.h * 1.15, dw = dh * asp;
      ctx.translate(o.x + o.w / 2, o.y + bobY + o.h / 2);
      ctx.rotate(Math.sin(o.frameT * 6) * 0.07);
      ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh);
    } else {
      // 地面障礙：放大一點更醒目，自帶草叢底座，底部貼地
      let dh = o.h * 1.22, dw = dh * asp;
      if (dw > H * 0.32) { dw = H * 0.32; dh = dw / asp; }
      ctx.drawImage(im, o.x + o.w / 2 - dw / 2, groundY() + H * 0.015 - dh, dw, dh);
    }
    ctx.restore();
    return;
  }
  let tex = null;
  if (o.type === 'rock') tex = TEX_ROCK;
  if (o.type === 'stump') tex = TEX_STUMP;
  if (o.type === 'log') tex = TEX_LOG;
  if (o.type === 'bee') tex = TEX_BEE[fr];
  if (o.type === 'bird') tex = TEX_BIRD[fr];
  if (o.type === 'branch') tex = TEX_BRANCH;
  if (!tex) return;
  ctx.drawImage(tex, o.x, o.y + bobY, o.w, o.h);
  if (!o.air) ell(ctx, o.x + o.w / 2, groundY() + H * 0.012, o.w * 0.5, H * 0.015, 'rgba(60,40,20,.25)');
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * H * 0.012, rnd(-1, 1) * shake * H * 0.012);
  // 遠景森林（BG001）
  const bg = IMG.BG001;
  if (bg && bg.complete && bg.naturalWidth) {
    const bh = groundY() + H * 0.06, bw = bh * (bg.naturalWidth / bg.naturalHeight);
    // 奇數塊左右鏡像，拼接處才不會出現「樹被切一半」的直線接縫
    let k = Math.floor(scrollFar / bw);
    for (let bx = -(scrollFar % bw); bx < W; bx += bw, k++) {
      if (k % 2) { ctx.save(); ctx.translate(bx * 2 + bw, 0); ctx.scale(-1, 1); ctx.drawImage(bg, bx, 0, bw + 1, bh); ctx.restore(); }
      else ctx.drawImage(bg, bx, 0, bw + 1, bh);
    }
  } else { ctx.fillStyle = '#bfe8ff'; ctx.fillRect(0, 0, W, H); }
  // 裝飾小鳥（OBS103 圖片面向左，往右飛才翻轉）
  for (const b of ambBirds) {
    ctx.save(); ctx.translate(b.x, b.y + Math.sin(state.t * 2 + b.ph) * H * 0.01);
    ctx.globalAlpha = 0.85;
    if (has(IMG.OBS103)) {
      if (b.sp > 0) ctx.scale(-1, 1);
      ctx.rotate(Math.sin(state.t * 5 + b.ph) * 0.08);
      ctx.drawImage(IMG.OBS103, -H * 0.033, -H * 0.022, H * 0.066, H * 0.044);
    } else {
      const fr = Math.floor(state.t * 6 + b.ph) % 2;
      if (b.sp < 0) ctx.scale(-1, 1);
      ctx.drawImage(TEX_BIRD[fr], -H * 0.03, -H * 0.024, H * 0.06, H * 0.048);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // 中景樹（BG003/BG004 圖片素材，備援用 canvas 畫的）
  for (const tr of midTrees) {
    const timg = tr.k ? IMG.BG004 : IMG.BG003;
    if (has(timg)) {
      const th = H * 0.36, tw2 = th * (timg.naturalWidth / timg.naturalHeight);
      drawSprB(timg, tr.x, groundY() + H * 0.03, tw2, th);
    } else {
      const th = H * 0.34;
      ctx.drawImage(TEX_TREE[tr.k], tr.x, groundY() - th + H * 0.02, th * 0.88, th);
    }
  }
  // 地面（BG002 拼接）
  const gd = IMG.BG002;
  const gh = H * 0.215;
  if (gd && gd.complete && gd.naturalWidth) {
    // 裁掉來源圖左右 8px 半透明邊 + 奇數塊鏡像，拼接無縫
    const sIn = 8, sw = gd.naturalWidth - sIn * 2;
    const gw = gh * (sw / gd.naturalHeight), gy = groundY() - gh * 0.16;
    let k = Math.floor(scrollGnd / gw);
    for (let gx = -(scrollGnd % gw); gx < W; gx += gw, k++) {
      if (k % 2) { ctx.save(); ctx.translate(gx * 2 + gw, 0); ctx.scale(-1, 1); ctx.drawImage(gd, sIn, 0, sw, gd.naturalHeight, gx, gy, gw + 1, gh); ctx.restore(); }
      else ctx.drawImage(gd, sIn, 0, sw, gd.naturalHeight, gx, gy, gw + 1, gh);
    }
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(0, groundY() + gh * 0.82, W, H - (groundY() + gh * 0.82));
  } else { ctx.fillStyle = '#7ccb5e'; ctx.fillRect(0, groundY(), W, H - groundY()); }
  // 終點旗
  if (state.flag) {
    const fh = H * 0.34;
    ctx.drawImage(TEX_FLAG, state.flag.x, groundY() - fh + H * 0.02, fh * 0.625, fh);
  }
  // 松果
  for (const it of items) {
    const bob = Math.sin(it.t * 4) * H * 0.008;
    const sz = it.gold ? H * 0.085 : H * 0.07;
    if (it.gold) {
      const g = ctx.createRadialGradient(it.x, it.y + bob, 2, it.x, it.y + bob, sz);
      g.addColorStop(0, 'rgba(255,220,90,.5)'); g.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = g; ctx.fillRect(it.x - sz, it.y + bob - sz, sz * 2, sz * 2);
    }
    const ii = it.gold ? IMG.ITEM002 : IMG.ITEM001;
    if (has(ii)) {
      const dw = sz * 0.95, dh = dw * (ii.naturalHeight / ii.naturalWidth);
      ctx.drawImage(ii, it.x - dw / 2, it.y + bob - dh / 2, dw, dh);
    } else {
      ctx.drawImage(it.gold ? TEX_GOLD : TEX_CONE, it.x - sz * 0.42, it.y + bob - sz * 0.5, sz * 0.85, sz);
    }
  }
  // 障礙
  for (const o of obstacles) drawObstacle(o);
  // 玩家
  drawPlayer();
  // 勝利場景：小狗拍手 + 獎盃
  if (state.phase === 'victory') {
    const pw = H * 0.26, fr = Math.floor(state.t * 3) % 2;
    drawSprB(fr ? IMG.CHAR102 : IMG.CHAR101, playerX() + H * 0.28, groundY() + H * 0.02, pw, pw);
    drawSprB(fr ? IMG.CHAR201 : IMG.CHAR202, playerX() + H * 0.55, groundY() + H * 0.02, pw, pw);
    const tw = H * 0.2, bounce = Math.abs(Math.sin(state.t * 3)) * H * 0.02;
    ctx.drawImage(TEX_TROPHY, playerX() - tw / 2, groundY() - H * 0.52 - bounce, tw, tw);
    ctx.font = `bold ${Math.round(H * 0.075)}px "Microsoft JhengHei", sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.lineWidth = H * 0.012; ctx.strokeStyle = 'rgba(30,90,30,.8)';
    ctx.strokeText('🎉 太棒了！', W / 2, H * 0.3);
    ctx.fillText('🎉 太棒了！', W / 2, H * 0.3);
  }
  // 前景草叢
  for (const tf of tufts) ctx.drawImage(TEX_TUFT, tf.x, H - H * 0.075, H * 0.14 * (tf.k ? 1 : 0.7), H * 0.07 * (tf.k ? 1 : 0.7));
  drawParticles();
  ctx.restore();
}

/* ================== HUD ================== */
const hCones = document.getElementById('hCones');
const hudBarFill = document.getElementById('hudBarFill'), hudBarIcon = document.getElementById('hudBarIcon');
const enWrap = document.getElementById('enWrap'), enFill = document.getElementById('enFill'), enText = document.getElementById('enText');
const stepTip = document.getElementById('stepTip');
const hudRound = document.getElementById('hudRound');
function syncHUD() {
  if (state.phase === 'menu') return;
  hCones.textContent = '🌰 ' + state.cones;
  hudRound.textContent = state.round > 1 ? '第 ' + state.round + ' 輪' : '';
  hudBarFill.style.width = (state.prog * 100) + '%';
  hudBarIcon.style.left = (4 + state.prog * 88) + '%';
  const full = state.energy >= ENERGY_MAX;
  enFill.style.width = (state.energy / ENERGY_MAX * 100) + '%';
  enWrap.classList.toggle('full', full && state.hero <= 0);
  enText.textContent = state.hero > 0 ? '🚀 英雄模式！' : full ? '⚡ 能量滿了！' : '⚡ 英雄能量';
  btnJump.style.display = btnCrouch.style.display = (state.mode === 'touch' && state.phase === 'play') ? 'block' : 'none';
  btnHero.style.display = (state.mode === 'touch' && state.phase === 'play' && heroReady()) ? 'block' : 'none';
  let tip = '';
  if (state.phase === 'play') {
    if (['hit', 'roll', 'dizzy'].includes(state.run)) tip = '😵 跌倒了…馬上站起來！';
    else if (state.hero > 0) tip = '🚀 英雄模式！衝衝衝！';
    else if (state.energy >= ENERGY_MAX) tip = state.mode === 'body' ? '⚡ 能量滿了！雙手舉高高！' : '⚡ 能量滿了！按閃電按鈕！';
  }
  stepTip.textContent = tip;
}

/* ================== 主迴圈 ================== */
function onResize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  GYv = H * 0.80; SQ = H * 0.34;
  if (!tufts.length) {
    for (let i = 0; i < 5; i++) tufts.push({ x: rnd(0, W), k: chance(0.5) ? 1 : 0 });
    for (let i = 0; i < 3; i++) midTrees.push({ x: i * (W / 2.6) + rnd(0, W * 0.2), k: chance(0.5) ? 0 : 1 });
    for (let i = 0; i < 2; i++) ambBirds.push({ x: rnd(0, W), y: rnd(H * 0.06, H * 0.3), sp: rnd(30, 70) * (chance(0.5) ? 1 : -1), ph: rnd(0, 6) });
  }
}
window.addEventListener('resize', onResize); onResize();

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (state.phase !== 'menu') update(dt);
  musicTick(now);
  draw(); syncHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 開始頁先偷偷載圖，按下按鈕就不用等 */
loadImages();
</script>
